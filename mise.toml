[tools]
cmake = "4.4.3"
ninja = "1.13.2"
xcodegen = "2.46.0"

# Blink (https://blink.review) reviews each Claude Code turn's diff and hands
# the findings back to the agent. Its own install path is
# `curl -fsSL https://blink.review/install.sh | sh`, which always takes the
# newest build and drops it in ~/.local/bin -- unpinned, and invisible to
# everyone else working here. This pins it the way every other tool above is
# pinned, through mise's `http` backend.
#
# Why a raw URL rather than a registry name: Blink ships from the vendor's own
# CDN. There is no GitHub repository, no release tag, and no mise registry
# entry, so `ubi:`/`aqua:` have nothing to resolve. The CDN's download URL is
# content-addressed by the binary's own SHA-256, which turns out to be the
# stronger pin anyway -- the URL and the checksum are the same fact, so the
# two cannot drift apart and a tampered or rolled build cannot answer to this
# name.
#
# Two consequences to know about:
#   * Renovate cannot see this (nothing to query), so bumps are manual. Run
#     `Scripts/update-blink-pin.sh`; do not hand-edit the four values below.
#   * The vendor prunes superseded content-addressed files, so an old pin
#     eventually 404s. That failure is loud, at `mise install`, and the fix is
#     the same bump script.
# blink-pin:begin -- managed by Scripts/update-blink-pin.sh, do not hand-edit
[tools."http:blink"]
version = "0.1.2"
platforms.macos-arm64.url = "https://blink.review/downloads/cli/blink-darwin-arm64-2656629b96cb79471e4759c82b6b22e31167ad5239135edca5e6ff603d5cfc75.gz"
platforms.macos-arm64.checksum = "sha256:2656629b96cb79471e4759c82b6b22e31167ad5239135edca5e6ff603d5cfc75"
platforms.macos-x64.url = "https://blink.review/downloads/cli/blink-darwin-x64-b0d58f861a3dafed5f7d6c34acd711e19014f2ec2fba4da0434e5dff0e7efa2f.gz"
platforms.macos-x64.checksum = "sha256:b0d58f861a3dafed5f7d6c34acd711e19014f2ec2fba4da0434e5dff0e7efa2f"
# blink-pin:end

[tasks.build-deps]
description = "SDL3 + OpenAL Soft static libs (device + simulator)"
run = "Scripts/build-deps.sh"

[tasks.build-engine]
description = "Woof! static lib + WoofEngine.xcframework; stages woof.pk3"
run = "Scripts/build-engine.sh"
depends = ["build-deps"]

[tasks.fetch-freedoom]
description = "Freedoom WADs into App/Resources/GameData"
run = "Scripts/fetch-freedoom.sh"

[tasks.generate]
description = "Generate Waddle.xcodeproj"
run = "xcodegen generate"
dir = "App"
# project.yml references GameData/ and woof.pk3, which these tasks produce;
# wait for them when run together (e.g. bootstrap) without dragging a full
# engine build into a standalone `mise run generate`.
wait_for = ["build-engine", "fetch-freedoom"]

[tasks.bootstrap]
description = "Full from-scratch setup"
depends = ["build-engine", "fetch-freedoom", "generate"]

[tasks.test]
description = "Build and run the test suite (incl. engine smoke check) on iPhone and iPad"
# Two destinations, because the app ships universal (App/project.yml sets
# TARGETED_DEVICE_FAMILY "1,2") and iPad is the device it is built for. Issue
# #131: every test path here used to be pinned to one phone.
#
# The iPad leg runs FIRST, and that ordering is load-bearing. mise stops a
# task at its first failing line, and the iPhone leg is the whole scheme --
# including RealWADTests, whose failures without the fixtures in
# docs/learnings/simulator-test-hazards.md are expected rather than a
# regression. An iPad leg placed second would therefore never run on exactly
# the machines where the full scheme is red.
#
# The iPad leg is -only-testing:WaddleTests, matching what ci.yml runs there;
# see the note beside its "Run unit tests (iPad)" step for why. The iPhone leg
# keeps running the whole scheme, unchanged.
#
# The iPad simulator is created on demand rather than pre-provisioned --
# Scripts/ensure-ipad-simulator.sh owns that and prints the UDID, which
# nothing here needs.
run = """
Scripts/ensure-ipad-simulator.sh > /dev/null
xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
  -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)' \
  -only-testing:WaddleTests test
xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
  -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test
"""
depends = ["generate"]

[tasks.icons]
description = "Regenerate icon assets from Design/source/{freedoom-glyphs,duck}/"
run = "Scripts/render-icons.sh"

[tasks.check-icons]
description = "Verify the icon package is sound and matches both icon sources"
run = """
Scripts/check-icon-json.sh
Scripts/check-icons-fresh.sh
"""

[tasks.blink-setup]
description = "Sign in to Blink and install its Claude Code review hooks (once per machine)"
# Per-developer, not per-checkout: `blink setup` writes to the USER-level
# ~/.claude/settings.json (or $CLAUDE_CONFIG_DIR), which is deliberately not
# something this repository can carry -- .gitignore excludes .claude/* here,
# and the hooks are a choice each contributor makes for their own machine.
# What the repository DOES carry is the pinned CLI above, so everyone who opts
# in runs the same build.
#
# Undo with `blink setup claude-code --remove`, or `blink uninstall` for the
# token and config too. Neither touches the mise pin.
run = '''
if blink auth status >/dev/null 2>&1; then
  echo "already signed in to Blink"
else
  blink auth login
fi
blink setup claude-code

# `blink setup` writes a BARE `blink review --hook claude-code` into that
# user-level settings file -- outside this repository, and outside mise's
# reach. A mise-managed blink answers that bare name only through the shims
# directory, so the hook resolves only if the shims directory is on the PATH
# the hook inherits. mise does not arrange that: both `mise activate` and
# `mise run` prepend the tool's own install directory instead, which is
# exactly why `blink` works in this task whether or not the hook will.
#
# So the check below asks about $PATH as INHERITED rather than probing with
# `command -v`: mise adds the install directory to this task's PATH but never
# the shims directory, so what it describes is the shell environment Claude Code
# was launched with. See docs/learnings/blink-hook-needs-mise-shims-on-path.md.
#
# It asks mise for that directory rather than rebuilding it from $MISE_DATA_DIR,
# because MISE_SHIMS_DIR, a `shims_dir` setting and $XDG_DATA_HOME each move it,
# and naming the wrong one fails a machine that is configured correctly. `mise
# doctor` has resolved all three already, and its `shims_on_path` is this very
# question, answered against the PATH it inherited from this task.
#
# Through --json, and parsed rather than grepped: doctor's human output is a
# report, whose labels and tilde-abbreviated paths can be reworded at any
# release, while the JSON is the interface meant to be read by a program.
# python3 is what Scripts/asc-jwt.sh and Scripts/check-icon-json.sh already
# reach for, and nothing here builds without an Xcode toolchain anyway.
#
# Nothing below inspects an exit status, and that is required rather than
# sloppy. `mise doctor` exits 1 on ANY problem it finds -- an untrusted config
# file, a tool that some other mise.toml pins and nobody installed -- while
# still printing complete JSON. Measured: a directory with an untrusted config
# and one uninstalled tool exits 1 and still reports both keys read here. Gating
# on the status would turn every unrelated complaint into "could not read
# shims_on_path" and a refused setup on a machine whose shims are fine.
#
# The parser catches nothing, which covers the same ground from the other side:
# every way this can go wrong -- doctor missing, output that is not JSON, a
# doctor that no longer reports these two keys, a typo in the key names here --
# ends in a traceback on the suppressed stderr and an empty $probe, which is the
# one condition the branches test.
probe="$(mise doctor --json 2>/dev/null | python3 -c '
import json, sys
doctor = json.load(sys.stdin)
print(doctor["dirs"]["shims"])
print("yes" if doctor["shims_on_path"] else "no")
' 2>/dev/null || true)"
shims="$(printf '%s\n' "$probe" | sed -n 1p)"

case "$(printf '%s\n' "$probe" | sed -n 2p)" in
  yes)
    echo "ok - $shims is on PATH, so the hook will resolve blink"
    ;;
  no)
    echo "ERROR: $shims is not on your PATH." >&2
    echo "The hook just installed runs a bare 'blink', so it would fail with" >&2
    echo "'command not found' at the end of every Claude Code turn." >&2
    echo "Add this to your shell profile, then open a new terminal:" >&2
    echo "  export PATH=\"$shims:\$PATH\"" >&2
    exit 1
    ;;
  *)
    # Fail closed: a `mise doctor` that no longer answers this is not evidence
    # that the hook works.
    echo "ERROR: could not read shims_on_path out of 'mise doctor --json'." >&2
    echo "Check by hand that mise's shims directory is on your PATH -- the hook" >&2
    echo "just installed runs a bare 'blink' and resolves it only through there." >&2
    exit 1
    ;;
esac
'''
