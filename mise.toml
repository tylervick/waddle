[tools]
cmake = "4.4.2"
ninja = "1.13.2"
xcodegen = "2.46.0"

[tasks.build-deps]
description = "SDL3 + OpenAL Soft static libs (device + simulator)"
run = "Scripts/build-deps.sh"

[tasks.build-engine]
description = "Woof! static lib + WoofEngine.xcframework; stages woof.pk3"
run = "Scripts/build-engine.sh"
depends = ["build-deps"]

[tasks.fetch-freedoom]
description = "Freedoom WADs into App/Resources/GameData"
run = "Scripts/fetch-freedoom.sh"

[tasks.generate]
description = "Generate Waddle.xcodeproj"
run = "xcodegen generate"
dir = "App"
# project.yml references GameData/ and woof.pk3, which these tasks produce;
# wait for them when run together (e.g. bootstrap) without dragging a full
# engine build into a standalone `mise run generate`.
wait_for = ["build-engine", "fetch-freedoom"]

[tasks.bootstrap]
description = "Full from-scratch setup"
depends = ["build-engine", "fetch-freedoom", "generate"]

[tasks.test]
description = "Build and run the test suite (incl. engine smoke check) on iPhone and iPad"
# Two destinations, because the app ships universal (App/project.yml sets
# TARGETED_DEVICE_FAMILY "1,2") and iPad is the device it is built for. Issue
# #131: every test path here used to be pinned to one phone.
#
# The iPad leg runs FIRST, and that ordering is load-bearing. mise stops a
# task at its first failing line, and the iPhone leg is the whole scheme --
# including RealWADTests, whose failures without the fixtures in
# docs/learnings/simulator-test-hazards.md are expected rather than a
# regression. An iPad leg placed second would therefore never run on exactly
# the machines where the full scheme is red.
#
# The iPad leg is -only-testing:WaddleTests, matching what ci.yml runs there;
# see the note beside its "Run unit tests (iPad)" step for why. The iPhone leg
# keeps running the whole scheme, unchanged.
#
# The iPad simulator is created on demand rather than pre-provisioned --
# Scripts/ensure-ipad-simulator.sh owns that and prints the UDID, which
# nothing here needs.
run = """
Scripts/ensure-ipad-simulator.sh > /dev/null
xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
  -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)' \
  -only-testing:WaddleTests test
xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
  -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test
"""
depends = ["generate"]

[tasks.icons]
description = "Regenerate icon assets from Design/source/waddle-logo.png"
run = "Scripts/render-icons.sh"

[tasks.check-icons]
description = "Verify the icon package is sound and matches the source render"
run = """
Scripts/check-icon-json.sh
Scripts/check-icons-fresh.sh
"""
