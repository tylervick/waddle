name: CI

on:
  pull_request:
  push:
    branches: [main]

# The build needs only the repo.
permissions:
  contents: read

# Supersede in-flight runs when a PR is pushed again. main is exempted: a
# cancelled run never reaches the post-job step that saves actions/cache@v4
# entries, and every PR's cache inherits only from main's, so a cancelled
# main run leaves PRs with nothing to restore and forces a cold build
# indefinitely. main must always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Toolchain pins live here so a bump is a one-line edit. XCODE_VERSION also
  # feeds both cache keys inside the setup action.
  XCODE_VERSION: "26.2"
  # Pinned for the same reason as the others: the installer resolves "latest"
  # from GitHub releases, so an unpinned CLI changes under the job without a
  # commit. This is the version the recipe was proven against.
  REVYL_VERSION: "v0.1.119"
  SIMULATOR_OS: "26.2"
  SIMULATOR_DEVICE: "iPhone 17 Pro"
  # The app ships universal (App/project.yml sets TARGETED_DEVICE_FAMILY
  # "1,2"), so the unit suite runs on an iPad too. This name must stay in
  # step with Scripts/ensure-ipad-simulator.sh, which owns the matching
  # CoreSimulator device type and creates the device; if the two ever
  # disagree, check-simulator-available.sh below fails the job by name
  # rather than testing whatever else was lying around.
  SIMULATOR_DEVICE_IPAD: "iPad Pro 13-inch (M4)"

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: macos-26
    # Measured on a hosted runner: cold (no cache) 8m37s, warm (cache hit)
    # 4m14s -- setup alone drops from 3m59s to 12s. 90 minutes is deliberate
    # headroom well beyond either figure, not a number derived from them.
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 (all history, all branches/tags), not the default
      # shallow depth-1 clone: Scripts/check-red-green.sh needs
      # `git merge-base HEAD origin/<base>` to resolve, and a depth-1 fetch
      # brings back only the ref being built -- no `origin/main` at all on a
      # pull_request run (merge-base fails outright: "Not a valid object name
      # origin/main"), and `origin/main` aliased to HEAD itself on a push to
      # main (merge-base succeeds but the diff against it is empty, so the
      # proof is permanently n/a). Reproduced against a scratch clone before
      # this change and confirmed fixed after; this repo's history is small
      # (39M .git, ~300 commits) so the unshallow fetch this adds is well
      # under a second, against a job otherwise measured at minutes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Cheap (most ~0.1s; the three loop suites together are ~12s, and
      # test-whats-to-test.sh ~20s -- it builds a throwaway git repository per
      # case) and they guard the value both cache keys depend on, plus the
      # check that stops a stale engine from being shipped.
      #
      # This list must name EVERY Scripts/test-*.sh suite, not just the ones
      # that guard the build. Scripts/check-red-green.sh's shell domain reverts
      # a changed script and re-runs the matching suite, and the spec's reason
      # for having no confirm-green step is that "CI already runs the full
      # suite on the pull request as-is" -- a premise this list is what makes
      # true for shell work. test-loop-report.sh and test-loop-precheck.sh ran
      # nowhere on a pull request, and test-check-issue-format.sh only in
      # issue-format.yml, which triggers on issues/schedule/workflow_dispatch
      # and never on a pull request; a change breaking one of those suites was
      # green here and then scored `proved` for breaking its own tests. The
      # script now runs its own green-HEAD baseline so it no longer depends on
      # this list staying complete, but an omission here is still a suite
      # nobody runs before merge.
      - name: Verify the build-script helpers
        run: |
          Scripts/test-engine-fingerprint.sh
          Scripts/test-check-engine-fresh.sh
          Scripts/test-check-simulator-available.sh
          Scripts/test-ensure-ipad-simulator.sh
          Scripts/test-check-red-green.sh
          Scripts/test-release-args.sh
          Scripts/test-check-substrate.sh
          Scripts/test-check-name-consistency.sh
          Scripts/test-build-deps.sh
          Scripts/test-check-icons-fresh.sh
          Scripts/test-check-icon-json.sh
          Scripts/test-loop-report.sh
          Scripts/test-loop-precheck.sh
          Scripts/test-check-masked-gh-status.sh
          Scripts/test-check-eas-bank.sh
          Scripts/test-check-eas-realtime.sh
          # Both hermetic: test-asc-jwt.sh generates its own throwaway EC key
          # and never reads the real App Store Connect key; test-whats-to-test.sh
          # stubs git, curl and the token minter and never reaches the network.
          # They guard the release path, which is the one place a green run
          # that ships the wrong thing costs a build number to undo.
          Scripts/test-asc-jwt.sh
          Scripts/test-whats-to-test.sh
          Scripts/test-upload.sh
          # Decides whether testflight.yml's nightly schedule ships at all.
          # Hermetic: throwaway git repos in a temp dir, with a ceiling set so
          # the no-repository cases cannot wander up into this checkout. It is
          # the only pull-request-visible test of that gate -- the workflow
          # bash around it runs nowhere before merge.
          Scripts/test-release-due.sh
          # Hermetic: it clears GH_TOKEN/GITHUB_TOKEN and strips PATH itself,
          # so it needs no credentials here and never reaches real GitHub.
          # issue-format.yml runs it too, but that workflow fires on
          # issues/schedule/workflow_dispatch only -- never on a pull request.
          Scripts/test-check-issue-format.sh
          Scripts/check-substrate.sh
          # The app's name is Waddle; the stylized form is a wordmark and
          # belongs only in Design/. Pure text scan of tracked files; no
          # network, no token. (This comment cannot quote the spelling it
          # forbids -- ci.yml is not on the guard's exemption list.)
          Scripts/check-name-consistency.sh
          # Refuses a `gh api` call whose exit status is masked into a
          # fabricated answer -- the defect PR #66 and issue #68 each fixed one
          # instance of. Pure text scan of Scripts/; no network, no token.
          Scripts/check-masked-gh-status.sh

      # The hermetic suite above proves whats-to-test.sh against fixtures. This
      # runs it against THIS repository, on this pull request's own range, so a
      # change that passes its fixtures and still cannot assemble real notes is
      # caught here rather than during a release -- where the failure lands
      # after the build is uploaded and tagged, and costs a build number.
      #
      # --print only: no token, no network, no App Store Connect. It is also
      # what makes Scripts/whats-to-test.sh loop-eligible under "Rules that are
      # absolute" in Scripts/loop-prompt.md, which draws its line at whether a
      # pull request can verify a change before merge.
      #
      # Gating on purpose, unlike the red-green proof below: this asserts
      # correctness, not a measurement, so a failure should stop the merge.
      # Two outcomes are correct here, and conflating them is the trap this
      # step already fell into once: assembling notes, and REFUSING because
      # there is genuinely nothing to say. The second is a documented, deliberate
      # refusal -- right for a release, not a defect in the assembler -- and it
      # is reachable whenever a branch sits at or behind the newest build tag.
      # Only a crash, or output that is neither of those shapes, is a failure.
      - name: Smoke the release-notes assembler on this branch
        run: |
          set +e
          out="$(Scripts/whats-to-test.sh --print 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$out" | grep -q '^- ' \
              || { echo "::error::--print exited 0 but produced no changelog bullets"; exit 1; }
            echo "assembler produced notes"
          elif printf '%s\n' "$out" | grep -q 'Nothing to tell a tester'; then
            echo "assembler correctly refused: nothing to report since the last build"
          else
            echo "::error::--print failed for a reason other than having nothing to report"
            exit 1
          fi
          # --sync-only, not the full check: this step runs before the toolchain
          # setup and the runner has neither uv nor potrace. It still catches the
          # drift that actually happens -- Design/ regenerated without the .icon
          # package being updated. The full regeneration check is `mise run
          # check-icons` locally.
          Scripts/check-icons-fresh.sh --sync-only
          # Catches icon.json mistakes that actool compiles green: a
          # silently-ignored root-level key, a layer whose artwork is
          # absent, orphaned assets. python3 only, no extra tooling.
          Scripts/check-icon-json.sh

      - uses: ./.github/actions/setup-waddle-build
        id: setup
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # The two SONiVOX guards read Vendor/src/sonivox, which only exists when
      # build-deps.sh actually ran. On a cache hit it did not, and only
      # Vendor/out/* was restored -- so this is gated on the action's
      # deps-built output rather than left to skip.
      #
      # Gating this way is not a hole. Both caches key on build-deps.sh (the
      # deps cache directly, the engine cache through engine-fingerprint.sh,
      # which hashes that script), so any change to SONIVOX_TAG misses both and
      # forces a rebuild -- meaning these run on exactly the pull requests that
      # could change their answer. A cache hit means the pin is byte-identical
      # to one already verified.
      #
      # The suites above run unconditionally and cover the guards' own logic;
      # this step is what points them at the real checkout.
      - name: Verify the MIDI synthesis path
        if: steps.setup.outputs.deps-built == 'true'
        # shell: bash is load-bearing, not style. The default for `run:` is
        # `bash -e`, which has NO pipefail, so `guard | tee` takes tee's exit
        # status and a FAILING guard reports success. Verified: under `bash -e`
        # a guard exiting 1 into tee gives pipeline exit 0. `shell: bash` runs
        # `bash --noprofile --norc -eo pipefail`, which is what makes the
        # failures below actually fail. See
        # docs/learnings/masked-exit-status-fails-open.md.
        shell: bash
        run: |
          # Neither may report `skip - ` here: the sources are present by the
          # condition above, so a skip can only mean something broke, and a
          # guard that silently skips is indistinguishable from one that
          # always passes.
          Scripts/check-eas-bank.sh | tee "$RUNNER_TEMP/eas-bank.txt"
          ! grep -q '^skip - ' "$RUNNER_TEMP/eas-bank.txt"
          Scripts/check-eas-realtime.sh | tee "$RUNNER_TEMP/eas-rtf.txt"
          ! grep -q '^skip - ' "$RUNNER_TEMP/eas-rtf.txt"

      # CI run 31427755601 failed with an empty simulator enumeration on an
      # otherwise-clean commit and runner image; a bare re-run passed. This
      # confirms both destinations actually exist before the build spends the
      # whole run on them, using the same device/OS values the two DESTINATION
      # values below do, so they can never disagree. See
      # docs/learnings/simulator-enumeration-race.md.
      - name: Verify simulators are available
        run: |
          Scripts/check-simulator-available.sh "$SIMULATOR_DEVICE" "$SIMULATOR_OS"
          # The iPad is created on demand rather than pre-provisioned, and the
          # iPad a runner image does hand you is the wrong size class -- see
          # the header of Scripts/ensure-ipad-simulator.sh.
          #
          # Deliberately AFTER the phone check: that one retries through the
          # cold-runner enumeration race, and this script reads the same
          # enumeration, so during such a window it would see no iPad and
          # create a duplicate. Passing the phone check first is what makes
          # its lookup trustworthy.
          udid="$(Scripts/ensure-ipad-simulator.sh "$SIMULATOR_OS")"
          Scripts/check-simulator-available.sh "$SIMULATOR_DEVICE_IPAD" "$SIMULATOR_OS"
          # Start the iPad booting HERE rather than leaving it to its own test
          # step. A simulator created seconds ago has never booted, and on run
          # 31980014093 that first boot was ~87s of the iPad leg's 2m43s --
          # more than the code-signing and the tests put together. `boot`
          # returns immediately, so the device comes up while the iPhone leg
          # (~3m) runs and the cost overlaps work the job was doing anyway.
          #
          # Non-fatal on purpose, and it must stay that way: if the boot fails
          # or the device is already booting, xcodebuild boots it itself when
          # the iPad step runs, exactly as it did before this line existed.
          # This is an optimisation, not a precondition.
          xcrun simctl boot "$udid" || true

      # -only-testing:WaddleTests is REQUIRED, not a tuning choice: the
      # Waddle scheme's test action also includes WaddleUITests, which boot
      # the real engine and belong to the manually-dispatched ui-tests
      # workflow.
      - name: Run unit tests (iPhone)
        env:
          DESTINATION: platform=iOS Simulator,name=${{ env.SIMULATOR_DEVICE }},OS=${{ env.SIMULATOR_OS }}
        run: |
          xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
            -destination "$DESTINATION" \
            -only-testing:WaddleTests \
            -resultBundlePath TestResults.xcresult \
            test

      # The second destination, because the app ships universal and iPad is
      # the device it is built for. Until this step, every test path in the
      # repository was pinned to one phone and the only thing that ever looked
      # at an iPad was Scripts/capture-screenshots.sh, which asserts nothing
      # (issue #131).
      #
      # -only-testing:WaddleTests for the same REASON as the iPhone leg above:
      # the scheme's test action includes WaddleUITests.
      #
      # What this leg costs, measured on the runner (run 31980014093) rather
      # than locally -- a local figure is worthless here, because the local
      # simulator is already booted and the runner's is not:
      #
      #   ~20s   link + code-sign. NO recompile: the two legs build identical
      #          arm64-simulator products and share derived data.
      #   ~87s   first boot of the simulator created minutes earlier.
      #   ~48s   launching and running the 312 tests (17.9s of that is tests).
      #
      # 2m43s in total. The boot is the expensive part and it is not inherent,
      # so the step above starts it early, overlapping the iPhone leg: run
      # 31980939825 then measured this step at 1m33s, with the test phase
      # falling from 135s to 34s. That 1m33s is the real per-pull-request cost
      # of the iPad destination. If it ever grows back, the cheap fallback is
      # moving this leg to `push: main` (the cadence ui-tests.yml uses), not
      # deleting it.
      #
      # What makes this leg able to fail on its own -- rather than agreeing
      # with the iPhone leg on every assertion, which would buy nothing -- is
      # App/Tests/LiveDeviceOverlayLayoutTests.swift. Read its header before
      # adding a third destination.
      - name: Run unit tests (iPad)
        env:
          DESTINATION: platform=iOS Simulator,name=${{ env.SIMULATOR_DEVICE_IPAD }},OS=${{ env.SIMULATOR_OS }}
        run: |
          xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
            -destination "$DESTINATION" \
            -only-testing:WaddleTests \
            -resultBundlePath TestResults-ipad.xcresult \
            test

      # The loop's leading signal: does the test shipped with this change
      # actually fail without the change? Prints a greppable marker the same
      # way check-simulator-available.sh does.
      #
      # `|| true` and `continue-on-error` are BOTH deliberate and neither is
      # sloppiness: this step must never fail the build. A gating proof would
      # make the loop iterate until it went green, and the signal would read
      # `proved` on every trial forever -- the exact defect that made
      # coderabbit_findings_first a pre-fix snapshot. See
      # docs/superpowers/specs/2026-08-10-test-proof-signal-design.md.
      #
      # `if: success()` is the value this step would inherit anyway. It is
      # written out because it is load-bearing and the reader has to confront
      # it: this step must never RUN on a red build, for a reason as strong as
      # why it must never FAIL one. The proof is a *differential* measurement
      # -- it asks whether reverting the change makes the tests fail -- and
      # that only means anything if they pass at HEAD. The steps above are
      # what establish that: the helper suites cover the shell domain and
      # `-only-testing:WaddleTests` covers all of App/Tests/. If either is red,
      # the reverted run fails for a reason the revert did not cause, and the
      # verdict would be a fabricated `proved`.
      #
      # DO NOT change this to `if: always()` to close the "no marker in the
      # log" gap. loop-prompt.md section 4.1 already handles that gap
      # correctly: a grep that matches nothing is recorded as `error`, an
      # absent measurement. Running anyway would replace that honest absence
      # with a confident wrong number, which is the one outcome this whole
      # feature exists to prevent.
      - name: Red-green test proof
        if: success()
        continue-on-error: true
        env:
          RG_DESTINATION: platform=iOS Simulator,name=${{ env.SIMULATOR_DEVICE }},OS=${{ env.SIMULATOR_OS }}
        run: |
          out="$(Scripts/check-red-green.sh "origin/${{ github.base_ref || 'main' }}" || echo 'error')"
          echo "TEST_PROOF: $(printf '%s\n' "$out" | head -1)"
          echo "TEST_PROOF_DOMAINS: $(printf '%s\n' "$out" | sed -n 's/^domains: //p')"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-test-results
          path: |
            TestResults.xcresult
            TestResults-ipad.xcresult
          # A failing iPhone leg ends the job before the iPad leg runs, so one
          # of these two legitimately does not exist on that path. Without
          # this, that normal case annotates the run with a warning about a
          # missing artifact.
          if-no-files-found: ignore
          retention-days: 7

  # Deliberately a SEPARATE job with no `needs:` on build-and-test, and that
  # independence is the whole point. As a step inside that job this was step 11
  # of 12 -- behind both unit-test legs and the red-green proof -- so on run
  # 35410095359 (created 00:39:29) the upload did not start until 01:00:12,
  # roughly twenty minutes in. A preview build you can launch on a device at
  # minute five is worth far more than the same build at minute twenty, and
  # adding `needs: build-and-test` would reintroduce exactly the latency this
  # split removes. (The UI tests were never the blocker: ui-tests.yml is
  # `push: main` only and never runs on a pull request.)
  #
  # The cost of independence, stated plainly: this job repeats the checkout and
  # the setup action, so on a cold cache it builds SDL3/OpenAL and the engine a
  # second time in parallel with build-and-test rather than sharing that work.
  # That duplicated cost has NOT been measured on a runner yet -- the setup
  # figures quoted on build-and-test above were measured for a single job, and
  # nothing here should be read as a measurement of two running at once. Two
  # jobs racing on the same cache keys is also expected: whichever finishes
  # second finds the key already reserved and logs a cache-save warning. That
  # is a warning, not a failure, and the restore path is unaffected.
  # Decides whether a preview build is worth a macOS runner at all.
  #
  # It exists because the two halves of this pipeline were gated differently.
  # .revyl/config.yaml's pr_review.review_triggers.paths already scopes what
  # Revyl will REVIEW -- App/**, Engine/**, Scripts/**, mise.toml -- but the
  # publish job below had no filter, so a docs-only pull request restored the
  # caches, built the app and uploaded an artifact that Revyl then ignored.
  # #228 did exactly that.
  #
  # The two path lists are a pair and have to stay in step. They are duplicated
  # rather than shared because one lives in a workflow and the other in a Revyl
  # config, and nothing reads both. Drift one way wastes a build; drift the
  # other way withholds the artifact from a review that wanted one, which stops
  # being harmless once pr_review.strict_ci_check.build is true.
  #
  # Ubuntu rather than macOS, and one API call rather than a checkout: a gate
  # that cost what it saves would be pointless.
  changed-paths:
    name: Detect app changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          # The API reports the pull request's own file list, so this needs no
          # checkout and no merge-base arithmetic. --paginate is load-bearing:
          # a page is 30 files by default and this repository has merged far
          # larger changes than that.
          files="$(gh api --paginate "$PR_FILES_URL" --jq '.[].filename')"

          # `case` patterns, where * spans / -- so App/* matches a file at any
          # depth under App/, which is what the Revyl path list means by
          # "App/**". Globbing rules differ from pathname expansion here, and
          # that difference is the reason this reads as it does.
          while IFS= read -r f; do
            case "$f" in
              App/*|Engine/*|Scripts/*|mise.toml)
                echo "app=true" >> "$GITHUB_OUTPUT"
                echo "::notice::$f can change the binary; building a preview"
                exit 0
                ;;
            esac
          done <<< "$files"

          echo "app=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no App/, Engine/, Scripts/ or mise.toml change; skipping the preview build"

  revyl-preview:
    name: Revyl preview build
    # Pull requests only: the whole point is an artifact bound to a review.
    # Hoisted from the step to the job so a push to main does not spend a
    # runner on a checkout and a toolchain setup for a step that would skip.
    # The `success()` half of the old condition is gone with the move -- there
    # is no prior step in this job whose success it could mean, and gating on
    # build-and-test is the thing this job exists not to do.
    #
    # draft: pr_review.review_triggers.drafts is false, so Revyl would not
    # review a draft's artifact even if one arrived. Building it is spend with
    # no reader.
    #
    # fork: a pull request from a fork receives no secrets, so REVYL_API_KEY is
    # absent and the upload step takes its skip path -- but only AFTER a full
    # checkout, toolchain setup and app build have been paid for. Deciding here
    # instead makes that cost nothing. Fork contributors got no preview either
    # way; this only stops charging for the disappointment.
    needs: changed-paths
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changed-paths.outputs.app == 'true'
    runs-on: macos-26
    # Headroom, not a measurement: the upload step itself was measured at 2m40s
    # and 1m11s (see below) and setup at 12s warm / 3m59s cold in the job above.
    # 45 minutes is far beyond any of those and is here to stop a wedged runner
    # from burning an hour, not because anything approaches it.
    timeout-minutes: 45
    steps:
      # Plain shallow checkout, unlike build-and-test's fetch-depth: 0. That
      # job needs full history because check-red-green.sh resolves
      # `git merge-base HEAD origin/<base>`; nothing here does. The only git
      # reader on this path is generate-build-info.sh, which wants HEAD alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same setup the test job uses, for the same reason: this build links the
      # WoofEngine xcframework, which the action either restores from cache or
      # builds. Its deps-built output is not consulted here -- the SONiVOX
      # guards that depend on it live in build-and-test and stay there.
      - uses: ./.github/actions/setup-waddle-build
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Publishes the simulator build to Revyl so a pull request has a real
      # artifact to launch a device against (.revyl/config.yaml sets
      # pr_review.build.kind: ci_upload_to_revyl, which means Revyl expects
      # the artifact from here rather than building the app itself -- a cloud
      # build would recompile the whole vendored dependency set a second time
      # having already paid for it here).
      #
      # It builds rather than reusing a test build, and that is not waste -- it
      # is also no longer avoidable, since this job no longer shares a runner
      # with the test legs. Those legs build with ENABLE_DEBUG_DYLIB at its
      # default, so their product carries Waddle.debug.dylib and
      # __preview.dylib; that is the Xcode debug-dylib layout, not a standalone
      # bundle, and it is not what should be installed on a device under test.
      # -derivedDataPath still points somewhere separate, which now costs
      # nothing to keep and documents that this tree is not the test legs'.
      # build/ is used because .gitignore already covers it -- a new top-level
      # directory would leave the tree dirty, which is precisely what
      # check-red-green.sh refuses to run against
      # (docs/learnings/fixture-stub-trips-own-dirty-tree-guard.md).
      #
      # Measured on hosted runners while this still lived inside build-and-test:
      # 2m40s on run 35410095359 and 1m11s on 35410545973. The spread is the
      # engine cache -- this step's own -derivedDataPath is a fresh tree every
      # time (DerivedData is cached nowhere in this repository, deliberately),
      # so the Swift compile is always cold and the rest tracks whether
      # Vendor/out was restored. Those numbers are for the xcodebuild step only
      # and do not include this job's own checkout and setup.
      #
      # If it ever grows dear, the cheap fix is the one the iPad leg
      # documents: move this to `push: main` rather than delete it.
      #
      # ARCHS=arm64 is required, not tidiness: a generic simulator destination
      # builds x86_64 too and the engine xcframework has only an arm64
      # simulator slice. See
      # docs/learnings/generic-simulator-destination-adds-x86_64.md.
      - name: Publish build to Revyl
        # Paired with pr_review.strict_ci_check.build: false in
        # .revyl/config.yaml. Neither this nor that is a permanent setting --
        # they are both "this path has never run on a real pull request", and
        # they should be flipped together once it has. Until then a Revyl-side
        # outage must not be able to fail this job.
        continue-on-error: true
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
        run: |
          # Absent on pull requests from forks, which do not receive secrets,
          # and on every run until the secret is added. Skipping is correct in
          # both cases; failing would punish a contributor for a permission
          # they cannot hold.
          if [ -z "${REVYL_API_KEY:-}" ]; then
            echo "::notice::REVYL_API_KEY is not set; skipping the Revyl upload"
            exit 0
          fi
          curl -fsSL https://revyl.com/install.sh | sh
          export PATH="$HOME/.revyl/bin:$PATH"
          revyl --version

          xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            build

          ditto -c -k --keepParent \
            build/Build/Products/Debug-iphonesimulator/Waddle.app \
            build/Waddle.app.zip

          # --commit takes the PULL REQUEST HEAD sha. github.sha is the
          # ephemeral merge commit on a pull_request event, which exists on no
          # branch and is not what Revyl matches a review against; passing it
          # would register builds against a commit nobody can look up.
          # Without --version the CLI names the build after the clock
          # ("20260919-010233"), which identifies nothing in a list. The PR
          # number and head sha are what someone reading the dashboard
          # actually wants.
          #
          # --no-set-current is what makes running ungated safe. Nothing here
          # knows whether the unit tests passed -- build-and-test is still
          # running alongside -- so this publishes previews for builds that go
          # on to fail. That is the deliberate trade: a broken build is often
          # exactly the one you want to launch on a device and watch break.
          # What must NOT happen is a red build silently becoming the app's
          # current version for everyone else, so the upload registers the
          # build and stops short of promoting it. Whoever wants this one
          # picks it by the --version string above.
          revyl build upload \
            --file build/Waddle.app.zip \
            --platform ios \
            --version "pr${{ github.event.pull_request.number }}-$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" \
            --app "8d5b0635-f1df-4a9f-8978-366771843c12" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --no-set-current \
            --yes --json
