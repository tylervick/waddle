name: CI

on:
  pull_request:
  push:
    branches: [main]

# The build needs only the repo.
permissions:
  contents: read

# Supersede in-flight runs when a PR is pushed again. main is exempted: a
# cancelled run never reaches the post-job step that saves actions/cache@v4
# entries, and every PR's cache inherits only from main's, so a cancelled
# main run leaves PRs with nothing to restore and forces a cold build
# indefinitely. main must always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Toolchain pins live here so a bump is a one-line edit. XCODE_VERSION also
  # feeds both cache keys inside the setup action.
  XCODE_VERSION: "26.2"
  SIMULATOR_OS: "26.2"
  SIMULATOR_DEVICE: "iPhone 17 Pro"

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: macos-26
    # Measured on a hosted runner: cold (no cache) 8m37s, warm (cache hit)
    # 4m14s -- setup alone drops from 3m59s to 12s. 90 minutes is deliberate
    # headroom well beyond either figure, not a number derived from them.
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 (all history, all branches/tags), not the default
      # shallow depth-1 clone: Scripts/check-red-green.sh needs
      # `git merge-base HEAD origin/<base>` to resolve, and a depth-1 fetch
      # brings back only the ref being built -- no `origin/main` at all on a
      # pull_request run (merge-base fails outright: "Not a valid object name
      # origin/main"), and `origin/main` aliased to HEAD itself on a push to
      # main (merge-base succeeds but the diff against it is empty, so the
      # proof is permanently n/a). Reproduced against a scratch clone before
      # this change and confirmed fixed after; this repo's history is small
      # (39M .git, ~300 commits) so the unshallow fetch this adds is well
      # under a second, against a job otherwise measured at minutes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap (most ~0.1s; the three loop suites together are ~12s) and they
      # guard the value both cache keys depend on, plus the check that stops a
      # stale engine from being shipped.
      #
      # This list must name EVERY Scripts/test-*.sh suite, not just the ones
      # that guard the build. Scripts/check-red-green.sh's shell domain reverts
      # a changed script and re-runs the matching suite, and the spec's reason
      # for having no confirm-green step is that "CI already runs the full
      # suite on the pull request as-is" -- a premise this list is what makes
      # true for shell work. test-loop-report.sh and test-loop-precheck.sh ran
      # nowhere on a pull request, and test-check-issue-format.sh only in
      # issue-format.yml, which triggers on issues/schedule/workflow_dispatch
      # and never on a pull request; a change breaking one of those suites was
      # green here and then scored `proved` for breaking its own tests. The
      # script now runs its own green-HEAD baseline so it no longer depends on
      # this list staying complete, but an omission here is still a suite
      # nobody runs before merge.
      - name: Verify the build-script helpers
        run: |
          Scripts/test-engine-fingerprint.sh
          Scripts/test-check-engine-fresh.sh
          Scripts/test-check-simulator-available.sh
          Scripts/test-check-red-green.sh
          Scripts/test-release-args.sh
          Scripts/test-check-substrate.sh
          Scripts/test-build-deps.sh
          Scripts/test-check-icons-fresh.sh
          Scripts/test-check-icon-json.sh
          Scripts/test-loop-report.sh
          Scripts/test-loop-precheck.sh
          Scripts/test-check-masked-gh-status.sh
          # Hermetic: it clears GH_TOKEN/GITHUB_TOKEN and strips PATH itself,
          # so it needs no credentials here and never reaches real GitHub.
          # issue-format.yml runs it too, but that workflow fires on
          # issues/schedule/workflow_dispatch only -- never on a pull request.
          Scripts/test-check-issue-format.sh
          Scripts/check-substrate.sh
          # Refuses a `gh api` call whose exit status is masked into a
          # fabricated answer -- the defect PR #66 and issue #68 each fixed one
          # instance of. Pure text scan of Scripts/; no network, no token.
          Scripts/check-masked-gh-status.sh
          # --sync-only, not the full check: this step runs before the toolchain
          # setup and the runner has neither uv nor potrace. It still catches the
          # drift that actually happens -- Design/ regenerated without the .icon
          # package being updated. The full regeneration check is `mise run
          # check-icons` locally.
          Scripts/check-icons-fresh.sh --sync-only
          # Catches icon.json mistakes that actool compiles green: a
          # silently-ignored root-level key, a layer whose artwork is
          # absent, orphaned assets. python3 only, no extra tooling.
          Scripts/check-icon-json.sh

      - uses: ./.github/actions/setup-waddle-build
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # CI run 31427755601 failed with an empty simulator enumeration on an
      # otherwise-clean commit and runner image; a bare re-run passed. This
      # confirms the destination actually exists before the build spends the
      # whole run on it, using the same device/OS values DESTINATION does
      # below, so the two can never disagree. See
      # docs/learnings/simulator-enumeration-race.md.
      - name: Verify simulator is available
        run: Scripts/check-simulator-available.sh "$SIMULATOR_DEVICE" "$SIMULATOR_OS"

      # -only-testing:WADdleTests is REQUIRED, not a tuning choice: the
      # WADdle scheme's test action also includes WADdleUITests, which boot
      # the real engine and belong to the manually-dispatched ui-tests
      # workflow.
      - name: Run unit tests
        env:
          DESTINATION: platform=iOS Simulator,name=${{ env.SIMULATOR_DEVICE }},OS=${{ env.SIMULATOR_OS }}
        run: |
          xcodebuild -project App/WADdle.xcodeproj -scheme WADdle \
            -destination "$DESTINATION" \
            -only-testing:WADdleTests \
            -resultBundlePath TestResults.xcresult \
            test

      # The loop's leading signal: does the test shipped with this change
      # actually fail without the change? Prints a greppable marker the same
      # way check-simulator-available.sh does.
      #
      # `|| true` and `continue-on-error` are BOTH deliberate and neither is
      # sloppiness: this step must never fail the build. A gating proof would
      # make the loop iterate until it went green, and the signal would read
      # `proved` on every trial forever -- the exact defect that made
      # coderabbit_findings_first a pre-fix snapshot. See
      # docs/superpowers/specs/2026-08-10-test-proof-signal-design.md.
      #
      # `if: success()` is the value this step would inherit anyway. It is
      # written out because it is load-bearing and the reader has to confront
      # it: this step must never RUN on a red build, for a reason as strong as
      # why it must never FAIL one. The proof is a *differential* measurement
      # -- it asks whether reverting the change makes the tests fail -- and
      # that only means anything if they pass at HEAD. The steps above are
      # what establish that: the helper suites cover the shell domain and
      # `-only-testing:WADdleTests` covers all of App/Tests/. If either is red,
      # the reverted run fails for a reason the revert did not cause, and the
      # verdict would be a fabricated `proved`.
      #
      # DO NOT change this to `if: always()` to close the "no marker in the
      # log" gap. loop-prompt.md section 4.1 already handles that gap
      # correctly: a grep that matches nothing is recorded as `error`, an
      # absent measurement. Running anyway would replace that honest absence
      # with a confident wrong number, which is the one outcome this whole
      # feature exists to prevent.
      - name: Red-green test proof
        if: success()
        continue-on-error: true
        env:
          RG_DESTINATION: platform=iOS Simulator,name=${{ env.SIMULATOR_DEVICE }},OS=${{ env.SIMULATOR_OS }}
        run: |
          out="$(Scripts/check-red-green.sh "origin/${{ github.base_ref || 'main' }}" || echo 'error')"
          echo "TEST_PROOF: $(printf '%s\n' "$out" | head -1)"
          echo "TEST_PROOF_DOMAINS: $(printf '%s\n' "$out" | sed -n 's/^domains: //p')"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: TestResults.xcresult
          retention-days: 7
