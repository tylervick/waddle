name: CI

on:
  pull_request:
  push:
    branches: [main]

# The build needs only the repo.
permissions:
  contents: read

# Supersede in-flight runs when a PR is pushed again. main is exempted: a
# cancelled run never reaches the post-job step that saves actions/cache@v4
# entries, and every PR's cache inherits only from main's, so a cancelled
# main run leaves PRs with nothing to restore and forces a cold build
# indefinitely. main must always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Toolchain pins live here so a bump is a one-line edit. XCODE_VERSION also
  # feeds both cache keys inside the setup action.
  XCODE_VERSION: "27.1"
  # Pinned for the same reason as the others: the installer resolves "latest"
  # from GitHub releases, so an unpinned CLI changes under the job without a
  # commit. This is the version the recipe was proven against.
  REVYL_VERSION: "v0.1.119"
  # SHA-256 of the revyl-darwin-arm64 release asset for REVYL_VERSION, from
  # https://github.com/RevylAI/revyl-cli/releases/download/<version>/checksums.txt.
  # The two Revyl jobs download that exact asset and verify it against this
  # before it runs, instead of piping the vendor's installer into a shell:
  # the installer is remote code that changes without notice, and it would
  # run in a job that also holds REVYL_API_KEY. Bump the version and this
  # digest together; a mismatch fails the job before anything credentialed.
  REVYL_CLI_SHA256: "455e2a8a247dfa808e5598a84668c097f7f5ec4efb8a00d1c2e3c3bac39287cc"
  # Deliberately NOT the same number as XCODE_VERSION. The iOS 27.1 simulator
  # runtime Xcode 27.1 downloads supports exactly one device type, iPhone Duo
  # (actions/runner-images#15000: every other type is "Incompatible device"),
  # so the pre-Duo devices this suite runs on live on the 27.0 runtime. The
  # binary is still built against the 27.1 SDK; only the simulator OS differs.
  # The Duo leg pins 27.1 on its own, in SIMULATOR_OS_DUO below.
  SIMULATOR_OS: "27.0"
  # The xcode-27 image pre-creates the iPhone 18 lineup and no iPhone 17 Pro.
  # The two have the same screen -- a simulator screenshot of each is
  # 1206x2622 px, measured 2026-11-09 on the iOS 27.0 runtime -- so the
  # 402x874 pt figures the layout tests cite for the 17 Pro hold here.
  SIMULATOR_DEVICE: "iPhone 18 Pro"
  # The app ships universal (App/project.yml sets TARGETED_DEVICE_FAMILY
  # "1,2"), so the unit suite runs on an iPad too. This name must stay in
  # step with Scripts/ensure-ipad-simulator.sh, which owns the matching
  # CoreSimulator device type and creates the device; if the two ever
  # disagree, check-simulator-available.sh below fails the job by name
  # rather than testing whatever else was lying around.
  SIMULATOR_DEVICE_IPAD: "iPad Pro 13-inch (M4)"
  # The third destination (issue #359). It is the one device the iOS 27.1
  # runtime supports, so it carries its own OS pin rather than SIMULATOR_OS.
  # The simulator boots closed, and nothing Apple ships opens it from a
  # command line (docs/learnings/iphone-duo-simulator-traps.md), so this leg
  # is the closed pose: a 466x678 pt window with a status column down one
  # side. The open pose has no CI coverage.
  SIMULATOR_DEVICE_DUO: "iPhone Duo"
  SIMULATOR_OS_DUO: "27.1"

jobs:
  # Four jobs that start together instead of one job that ran them in a row:
  # the shell suites here, and one unit-test leg per simulator below. Measured
  # over the 29 green runs before the split (2026-11-21/22), the single job was
  # a median 38.7 minutes: 8.3 of these suites, then 20.1 + 2.5 + 6.9 of the
  # three legs, each waiting for the one before it. Nothing in this job needs
  # the toolchain, the engine or a simulator, so it does not wait for them.
  #
  # The suites still run one after another inside the job. Six of them are
  # 7 of the 8.6 minutes (test-upload-screenshots.sh 147s, then the two Duo
  # suites, test-capture-export.sh, test-update-store-listing.sh and
  # test-whats-to-test.sh), and running those side by side was considered and
  # left alone: the Duo suites are timing nets (lock holders, hangs they must
  # time out, a client they must outlast), a busy runner is exactly what makes
  # such a suite flake, and this job is no longer the one a pull request
  # waits for.
  helper-suites:
    name: Build-script helpers
    runs-on: xcode-27
    # The step below took 4.3 to 10.6 minutes across those 29 runs. Headroom,
    # not a measurement.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 (all history, all branches/tags), not the default
      # shallow depth-1 clone: the release-notes smoke below measures from the
      # newest build-* tag, and a depth-1 fetch brings back neither the tags
      # nor the history behind them, so Scripts/whats-to-test.sh would quietly
      # take its bootstrap fallback instead of the real range. This repo's
      # history is small, so the unshallow fetch is well under a second
      # against a job otherwise measured at minutes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # uv for test-build-mark.sh and test-glyph-source.sh below, at the
      # version mise.toml pins; the runner image has none. This installs the
      # whole [tools] table (cmake, ninja and xcodegen too), so the suites that
      # touch cmake run at the pinned version a developer has, and the job
      # shares the mise cache the build legs already save under mise.toml's
      # hash.
      - name: Install pinned CLI tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      # They guard the value both cache keys depend on, the check that stops
      # a stale engine from being shipped, and the release path.
      #
      # This list must name EVERY Scripts/test-*.sh suite, not just the ones
      # that guard the build: a suite missing from it is a suite nobody runs
      # before merge. Scripts/check-suites-registered.sh, at the end of this
      # step, refuses one that is missing (issue #454, where three were).
      - name: Verify the build-script helpers
        run: |
          Scripts/test-engine-fingerprint.sh
          Scripts/test-check-engine-fresh.sh
          Scripts/test-check-simulator-available.sh
          Scripts/test-prepare-ui-test-simulator.sh
          Scripts/test-ui-test-launch-report.sh
          Scripts/test-ensure-ipad-simulator.sh
          Scripts/test-check-red-green.sh
          Scripts/test-release-args.sh
          Scripts/test-check-substrate.sh
          Scripts/test-check-name-consistency.sh
          Scripts/test-build-deps.sh
          Scripts/test-ensure-native-cmake-cache.sh
          Scripts/test-check-deps-current.sh
          Scripts/test-check-icons-fresh.sh
          Scripts/test-check-icon-json.sh
          Scripts/test-check-masked-gh-status.sh
          Scripts/test-check-proof-harness-flag.sh
          Scripts/test-globals-diff.sh
          Scripts/test-check-eas-bank.sh
          Scripts/test-check-eas-realtime.sh
          # Hermetic fixtures plus one live case: refuses a vendor-hosted tool
          # pin in mise.toml, which is how a dead CDN took CI down for weeks
          # (the Blink pin, PR #331 and the #330 merge run).
          Scripts/test-check-mise-tools-registry.sh
          Scripts/test-profile-session.sh
          # Hermetic fixtures plus one live case: refuses a job that calls a
          # reusable workflow reading secrets without passing it any, which
          # is how the first on-merge TestFlight release ran with every
          # secret empty.
          Scripts/test-check-called-workflow-secrets.sh
          # Hermetic fixtures plus one live case: refuses a hand-run script,
          # mise.toml or the README naming a different iPhone simulator from
          # SIMULATOR_DEVICE above, which is how four of them kept naming a
          # phone the runner image no longer has (issue #360).
          Scripts/test-check-simulator-pins.sh
          # Hermetic fixtures plus one live case: refuses testflight.yml
          # pushing with the job token, which cannot create a tag once main's
          # workflow files have moved past the tagged commit (build 277).
          Scripts/test-check-release-tag-token.sh
          # Hermetic fixtures plus one live case: refuses a ci.yml whose
          # testflight job does not wait for every check job in this file, or
          # would run after a failed or cancelled one. The gate is a list of
          # jobs now, where it used to be the one job everything ran in.
          Scripts/test-check-release-gate.sh
          # Both hermetic: test-asc-jwt.sh generates its own throwaway EC key
          # and never reads the real App Store Connect key; test-whats-to-test.sh
          # stubs git, curl and the token minter and never reaches the network.
          # They guard the release path, which is the one place a green run
          # that ships the wrong thing costs a build number to undo.
          Scripts/test-asc-jwt.sh
          Scripts/test-whats-to-test.sh
          Scripts/test-upload.sh
          # Hermetic: gh and the feedback fetcher are stubs, and one case runs
          # the real fetcher behind a curl stub. Guards testflight-feedback.yml,
          # whose failure modes are a replayed backlog or a silently lost report.
          Scripts/test-testflight-feedback-digest.sh
          # Hermetic: curl and the token minter are stubs. Guards
          # promote-build.yml, which changes who receives a TestFlight build;
          # its refusals (missing build, not VALID, missing group, failed
          # read-back) are each a separate case.
          Scripts/test-promote-build.sh
          # Hermetic: a strict curl stub plays App Store Connect. It guards
          # app-store-screenshots.yml, whose delete-then-upload would empty a
          # live listing if the set-ownership check ever stopped biting.
          Scripts/test-upload-screenshots.sh
          # The iPhone Duo inner-display leg (issue #409). The first stubs
          # orca and xcrun: the hook folds whichever simulator is selected in
          # Device Hub, so it must press nothing unless it has found its own.
          # The second runs the export on made-up shots (about a minute; it
          # calls `xcrun swift`): what it writes is committed and uploaded
          # as it is.
          Scripts/test-duo-pose-device-hub.sh
          Scripts/test-duo-layout-sweep.sh
          Scripts/test-capture-export.sh
          # Hermetic too, with a stateful stub so the read-back is exercised.
          # Guards app-store-listing.yml, which overwrites the store's text.
          Scripts/test-update-store-listing.sh
          Scripts/test-submit-for-review.sh
          # Decides whether a merge to main ships a TestFlight build at all
          # (the `testflight` job below calls testflight.yml, whose gate runs
          # it). Hermetic: throwaway git repos in a temp dir, with a ceiling
          # set so the no-repository cases cannot wander up into this
          # checkout. It is the only pull-request-visible test of that gate --
          # the workflow bash around it runs nowhere before merge.
          Scripts/test-release-due.sh
          # Hermetic: it clears GH_TOKEN/GITHUB_TOKEN and strips PATH itself,
          # so it needs no credentials here and never reaches real GitHub.
          # issue-format.yml runs it too, but that workflow fires on
          # issues/schedule/workflow_dispatch only -- never on a pull request.
          Scripts/test-check-issue-format.sh
          # Hermetic: curl is a stub and the token a fake ASC_JWT. Guards the
          # fetcher testflight-feedback.yml runs daily, which decides which
          # TestFlight feedback is reported and marked seen.
          Scripts/test-fetch-testflight-feedback.sh
          # Both need uv (installed above) and fetch Pillow through it. They
          # guard the app icon's mark: the compositor's transparent layer, and
          # the committed Freedoom glyph PNGs it is built from.
          Scripts/test-build-mark.sh
          Scripts/test-glyph-source.sh
          # Hermetic fixtures plus two live cases: refuses a Scripts/test-*.sh
          # that no run: block in this file names, which is how three suites
          # ran nowhere for months (issue #454).
          Scripts/test-check-suites-registered.sh
          Scripts/check-suites-registered.sh
          Scripts/check-substrate.sh
          # The app's name is Waddle; the stylized form is a wordmark and
          # belongs only in Design/. Pure text scan of tracked files; no
          # network, no token. (This comment cannot quote the spelling it
          # forbids -- ci.yml is not on the guard's exemption list.)
          Scripts/check-name-consistency.sh
          # Refuses a `gh api` call whose exit status is masked into a
          # fabricated answer -- the defect PR #66 and issue #68 each fixed one
          # instance of. Pure text scan of Scripts/; no network, no token.
          Scripts/check-masked-gh-status.sh

      # The hermetic suite above proves whats-to-test.sh against fixtures. This
      # runs it against THIS repository, on this pull request's own range, so a
      # change that passes its fixtures and still cannot assemble real notes is
      # caught here rather than during a release -- where the failure lands
      # after the build is uploaded and tagged, and costs a build number.
      #
      # --print only: no token, no network, no App Store Connect. It is also
      # what lets a pull request verify a change to Scripts/whats-to-test.sh
      # before it merges, instead of on the next release.
      #
      # Gating on purpose: this asserts correctness, so a failure should stop
      # the merge.
      # Two outcomes are correct here, and conflating them is the trap this
      # step already fell into once: assembling notes, and REFUSING because
      # there is genuinely nothing to say. The second is a documented, deliberate
      # refusal -- right for a release, not a defect in the assembler -- and it
      # is reachable whenever a branch sits at or behind the newest build tag.
      # Only a crash, or output that is neither of those shapes, is a failure.
      - name: Smoke the release-notes assembler on this branch
        run: |
          set +e
          out="$(Scripts/whats-to-test.sh --print 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$out" | grep -q '^- ' \
              || { echo "::error::--print exited 0 but produced no changelog bullets"; exit 1; }
            echo "assembler produced notes"
          elif printf '%s\n' "$out" | grep -q 'Nothing to tell a tester'; then
            echo "assembler correctly refused: nothing to report since the last build"
          else
            echo "::error::--print failed for a reason other than having nothing to report"
            exit 1
          fi
          # --sync-only, not the full check: the runner has no potrace (uv it
          # now has, from the step above). It still catches the
          # drift that actually happens -- Design/ regenerated without the .icon
          # package being updated. The full regeneration check is `mise run
          # check-icons` locally.
          Scripts/check-icons-fresh.sh --sync-only
          # Catches icon.json mistakes that actool compiles green: a
          # silently-ignored root-level key, a layer whose artwork is
          # absent, orphaned assets. python3 only, no extra tooling.
          Scripts/check-icon-json.sh

  # One job per simulator, started together. They used to be three steps of
  # one job, and the order cost more than the work did. Over the same 29 green
  # runs the iPhone step was a median 20.7 minutes, of which:
  #
  #    8.0   xcodebuild printing nothing at all, before "Command line
  #          invocation:". The job had just started the iPad booting in the
  #          background (to overlap its first boot with this leg), and a
  #          simulator's first boot holds up every other CoreSimulator client,
  #          xcodebuild's destination lookup included. The same xcodebuild
  #          call is past this point in 0.3 minutes in the iPad and Duo steps,
  #          and in 0.4 in ui-tests.yml, where the simulator has settled.
  #    6.3   compiling and linking, beside that simulator. ui-tests.yml builds
  #          the same targets in 1.8 on a runner whose simulator has settled.
  #    4.7   waiting for the phone to boot and take the test host.
  #    1.4   running the tests.
  #
  # So the time is simulators booting for the first time on a fresh runner,
  # not compiling, and three of them shared one machine. Here each leg has a
  # runner to itself and boots exactly one simulator, which is also the end
  # of the ordering rules the single job had grown (the iPad booted early,
  # the Duo only after `simctl shutdown all`, because three simulators up at
  # once lost run 42835006870 its runner).
  #
  # What it costs. Each leg compiles the app for itself, where the second and
  # third used to reuse the first's products: about two minutes of runner
  # time per extra leg, and none of wall time. A change to the engine
  # fingerprint is built from source by all three at once instead of by one
  # (whichever saves the cache second logs a warning; see the note on
  # revyl-preview). And a pull request now holds four macOS runners for ten
  # minutes rather than one for forty, on an account that runs five at a
  # time, so several pull requests at once queue behind each other sooner.
  #
  # Not done, on purpose: building once and handing the products to the legs
  # (build-for-testing, an artifact, test-without-building), or caching
  # DerivedData. The compile is the two minutes above; an artifact hop or a
  # cache restore costs about that, puts the legs behind a `needs:`, and a
  # DerivedData cache has no key that is known to be right.
  unit-tests:
    name: Unit tests (${{ matrix.leg }})
    runs-on: xcode-27
    # Deliberate headroom, as it was for the single job: a leg is expected in
    # about ten minutes, and the iPhone step alone has taken 48 on a slow
    # runner (issue #415). A tight limit would add cancellations of its own.
    timeout-minutes: 90
    strategy:
      # A red leg must not cancel the others. Each leg can fail on its own
      # (see the test step), so the other two results are still wanted; and a
      # sibling cancelled by fail-fast reads exactly like the unexplained
      # job-level cancellations issue #415 is counting.
      fail-fast: false
      matrix:
        include:
          # The names are the ones the "Pick this leg's simulator" step
          # switches on; `slug` only names the uploaded result bundle.
          - leg: iPhone
            slug: iphone
          # The second destination, because the app ships universal and iPad
          # is the device it is built for. Until this leg, every test path in
          # the repository was pinned to one phone and the only thing that
          # ever looked at an iPad was Scripts/capture-screenshots.sh, which
          # asserts nothing (issue #131).
          - leg: iPad
            slug: ipad
          # The third destination: an iPhone Duo, closed (issue #359).
          - leg: iPhone Duo
            slug: duo
    steps:
      # Plain shallow checkout: the release-notes smoke that needs tags and
      # history lives in helper-suites. The only git reader on this path is
      # generate-build-info.sh, which wants HEAD alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-waddle-build
        id: setup
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # The two SONiVOX guards read Vendor/src/sonivox, which only exists when
      # build-deps.sh actually ran. On a cache hit it did not, and only
      # Vendor/out/* was restored -- so this is gated on the action's
      # deps-built output rather than left to skip.
      #
      # Gating this way is not a hole. Both caches key on build-deps.sh (the
      # deps cache directly, the engine cache through engine-fingerprint.sh,
      # which hashes that script), so any change to SONIVOX_TAG misses both and
      # forces a rebuild -- meaning these run on exactly the pull requests that
      # could change their answer. A cache hit means the pin is byte-identical
      # to one already verified. On such a pull request every leg misses, so
      # every leg runs this; that is three answers to one question, and cheap.
      #
      # The suites in helper-suites run unconditionally and cover the guards'
      # own logic; this step is what points them at the real checkout.
      - name: Verify the MIDI synthesis path
        if: steps.setup.outputs.deps-built == 'true'
        # shell: bash is load-bearing, not style. The default for `run:` is
        # `bash -e`, which has NO pipefail, so `guard | tee` takes tee's exit
        # status and a FAILING guard reports success. Verified: under `bash -e`
        # a guard exiting 1 into tee gives pipeline exit 0. `shell: bash` runs
        # `bash --noprofile --norc -eo pipefail`, which is what makes the
        # failures below actually fail. See
        # docs/learnings/masked-exit-status-fails-open.md.
        shell: bash
        run: |
          # Neither may report `skip - ` here: the sources are present by the
          # condition above, so a skip can only mean something broke, and a
          # guard that silently skips is indistinguishable from one that
          # always passes.
          Scripts/check-eas-bank.sh | tee "$RUNNER_TEMP/eas-bank.txt"
          ! grep -q '^skip - ' "$RUNNER_TEMP/eas-bank.txt"
          Scripts/check-eas-realtime.sh | tee "$RUNNER_TEMP/eas-rtf.txt"
          ! grep -q '^skip - ' "$RUNNER_TEMP/eas-rtf.txt"

      # The matrix cannot read the workflow's `env:` pins (that context does
      # not exist where a matrix is defined), so the leg's name is turned into
      # its device and OS here, from the same pins everything else reads. An
      # unknown name fails rather than falling back to the phone: a leg that
      # quietly tested the wrong device would be green.
      - name: Pick this leg's simulator
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            iPhone)
              device="$SIMULATOR_DEVICE"; os="$SIMULATOR_OS" ;;
            iPad)
              device="$SIMULATOR_DEVICE_IPAD"; os="$SIMULATOR_OS" ;;
            # The one device the iOS 27.1 runtime supports, so it carries its
            # own OS pin. The simulator boots closed, and nothing Apple ships
            # opens it from a command line
            # (docs/learnings/iphone-duo-simulator-traps.md), so this leg is
            # the closed pose. The open pose has no CI coverage.
            "iPhone Duo")
              device="$SIMULATOR_DEVICE_DUO"; os="$SIMULATOR_OS_DUO" ;;
            *)
              echo "::error::no simulator is pinned for the leg \"$LEG\""
              exit 1 ;;
          esac
          [ -n "$device" ] && [ -n "$os" ] \
            || { echo "::error::the pins for the leg \"$LEG\" are empty"; exit 1; }
          {
            echo "LEG_DEVICE=$device"
            echo "LEG_OS=$os"
          } >> "$GITHUB_ENV"

      # CI run 31427755601 failed with an empty simulator enumeration on an
      # otherwise-clean commit and runner image; a bare re-run passed. This
      # confirms the destination actually exists before the build spends the
      # whole run on it, using the same device/OS values DESTINATION below
      # does, so they can never disagree. See
      # docs/learnings/simulator-enumeration-race.md.
      - name: Verify the simulator is available
        env:
          LEG: ${{ matrix.leg }}
        run: |
          if [ "$LEG" = iPad ]; then
            # The iPad is created on demand rather than pre-provisioned, and
            # the iPad a runner image does hand you is the wrong size class --
            # see the header of Scripts/ensure-ipad-simulator.sh.
            #
            # The phone is checked first on purpose, though this leg never
            # tests on it: that check retries through the cold-runner
            # enumeration race, and ensure-ipad-simulator.sh reads the same
            # enumeration, so during such a window it would see no iPad and
            # create a duplicate. Passing the phone check first is what makes
            # its lookup trustworthy.
            Scripts/check-simulator-available.sh "$SIMULATOR_DEVICE" "$SIMULATOR_OS"
            Scripts/ensure-ipad-simulator.sh "$SIMULATOR_OS" > /dev/null
          fi
          # The iPhone and the iPhone Duo are pre-created by the runner image,
          # so they are only checked, not ensured. If an image ever drops
          # one, this fails by name with the device list in the log, and the
          # fix is an ensure script like the iPad's.
          Scripts/check-simulator-available.sh "$LEG_DEVICE" "$LEG_OS"
          # Nothing is booted here, and that is the lesson of the single job
          # this replaced: it started the iPad booting in the background to
          # save that leg its first boot, and xcodebuild then sat for a
          # median eight minutes waiting on CoreSimulator before it compiled
          # anything. xcodebuild boots the device itself when the tests are
          # ready for it. See
          # docs/learnings/a-first-boot-blocks-every-coresimulator-client.md.

      # -only-testing:WaddleTests is REQUIRED, not a tuning choice: the
      # Waddle scheme's test action also includes WaddleUITests, which boot
      # the real engine and belong to ui-tests.yml.
      #
      # What makes each leg able to fail on its own -- rather than agreeing
      # with the others on every assertion, which would buy nothing -- is
      # App/Tests/LiveDeviceOverlayLayoutTests.swift. It pins each device's
      # displays to exact overlay scales, fails rather than falling back to
      # the generic phone band when the device is a Duo, and checks the
      # bottom cluster against Doom's status bar with the safe-area insets
      # the window really has. That last one is issue #351's regression
      # check, and it is the Duo's shape that makes it bite: with the layout
      # reverted to assuming the bar is at the window's bottom, it fails on
      # the Duo and passes on the phone. Read its header before adding a
      # fourth destination.
      #
      # If a leg ever grows dear, the fallback is moving it to `push: main`
      # (the cadence ui-tests.yml's full suite uses), not deleting it.
      - name: Run unit tests
        env:
          DESTINATION: platform=iOS Simulator,name=${{ env.LEG_DEVICE }},OS=${{ env.LEG_OS }}
        run: |
          xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
            -destination "$DESTINATION" \
            -only-testing:WaddleTests \
            -resultBundlePath TestResults.xcresult \
            test

      # What the runner had left when the leg ended, however it ended. It is
      # here for issue #415: unit-test jobs are cancelled from outside with
      # "The operation was canceled." and nothing else in the log, and all
      # twelve seen so far (the eleven in the issue, and the iPad leg of this
      # layout's first run, 44973823949) were cancelled while the iPad
      # simulator was up -- never in the Duo step, the helper suites or the
      # iPhone-only UI tests. Whether that is memory is what this prints:
      # compare a green iPad leg with a green iPhone leg, and read it on the
      # next cancelled one.
      #
      # always(), so it runs after a cancel and after a failure as well as
      # after a pass, and the passes are what a cancelled leg is compared
      # with. It decides nothing: continue-on-error, and every command may
      # fail on its own. About a second.
      - name: Report the runner's memory and load
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "leg: $LEG_DEVICE ($LEG_OS)"
          sysctl -n hw.memsize hw.ncpu | paste -sd' ' - | awk '{ printf "memory: %.1f GB, cpus: %d\n", $1 / 1073741824, $2 }'
          uptime
          sysctl vm.swapusage
          memory_pressure | tail -n 3
          vm_stat | head -n 12
          df -h / | tail -n 1
          echo "--- largest processes by resident memory"
          ps -axo rss=,pcpu=,comm= | sort -rn | head -n 12 \
            | awk '{ rss = $1; cpu = $2; $1 = ""; $2 = ""; n = split($0, parts, "/"); printf "%7.0f MB %5s%%  %s\n", rss / 1024, cpu, parts[n] }'
          # No `simctl` here, on purpose. After a failed or cancelled test
          # step a simulator may still be in its first boot, `simctl list`
          # waits for that (the learning this layout came from), and this
          # step would then hold the result upload behind it.

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # One name per leg: two legs uploading under one name is an error.
          name: ci-test-results-${{ matrix.slug }}
          path: TestResults.xcresult
          # A leg that fails before its test step has no bundle. Without
          # this, that normal case annotates the run with a warning about a
          # missing artifact.
          if-no-files-found: ignore
          retention-days: 7

  # Deliberately a SEPARATE job with no `needs:` on the unit-test legs, and that
  # independence is the whole point. As a step inside what was then the single
  # build-and-test job this was step 11 of 12 -- behind both unit-test legs and
  # the red-green proof -- so on run
  # 35410095359 (created 00:39:29) the upload did not start until 01:00:12,
  # roughly twenty minutes in. A preview build you can launch on a device at
  # minute five is worth far more than the same build at minute twenty, and
  # adding a `needs:` on the tests would reintroduce exactly the latency this
  # split removes. (The UI tests were never the blocker: ui-tests.yml is
  # `push: main` only and never runs on a pull request.)
  #
  # The cost of independence, stated plainly: this job repeats the checkout and
  # the setup action, so on a cold cache it builds SDL3/OpenAL and the engine a
  # second time in parallel with the unit-test legs rather than sharing that
  # work. That duplicated cost has NOT been measured on a runner yet, and
  # nothing here should be read as a measurement of it. Several
  # jobs racing on the same cache keys is also expected: whichever finishes
  # second finds the key already reserved and logs a cache-save warning. That
  # is a warning, not a failure, and the restore path is unaffected.
  # Decides whether a preview build is worth a macOS runner at all.
  #
  # It exists because the two halves of this pipeline were gated differently.
  # .revyl/config.yaml's pr_review.review_triggers.paths already scopes what
  # Revyl will REVIEW -- App/**, Engine/**, Scripts/**, mise.toml -- but the
  # publish job below had no filter, so a docs-only pull request restored the
  # caches, built the app and uploaded an artifact that Revyl then ignored.
  # #228 did exactly that.
  #
  # The two path lists are a pair and have to stay in step. They are duplicated
  # rather than shared because one lives in a workflow and the other in a Revyl
  # config, and nothing reads both. Drift one way wastes a build; drift the
  # other way withholds the artifact from a review that wanted one, which stops
  # being harmless once pr_review.strict_ci_check.build is true.
  #
  # Ubuntu rather than macOS, and one API call rather than a checkout: a gate
  # that cost what it saves would be pointless.
  changed-paths:
    name: Detect app changes
    # REVYL-PAUSED 2026-11-11: Revyl is switched off for the moment, here and
    # in .revyl/config.yaml (pr_review.enabled). The leading `false &&` is the
    # whole switch; to turn Revyl back on, delete it from the three jobs
    # marked REVYL-PAUSED and set pr_review.enabled back to true.
    if: false && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          # The API reports the pull request's own file list, so this needs no
          # checkout and no merge-base arithmetic. --paginate is load-bearing:
          # a page is 30 files by default and this repository has merged far
          # larger changes than that.
          files="$(gh api --paginate "$PR_FILES_URL" --jq '.[].filename')"

          # `case` patterns, where * spans / -- so App/* matches a file at any
          # depth under App/, which is what the Revyl path list means by
          # "App/**". Globbing rules differ from pathname expansion here, and
          # that difference is the reason this reads as it does.
          while IFS= read -r f; do
            case "$f" in
              App/*|Engine/*|Scripts/*|mise.toml)
                echo "app=true" >> "$GITHUB_OUTPUT"
                echo "::notice::$f can change the binary; building a preview"
                exit 0
                ;;
            esac
          done <<< "$files"

          echo "app=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no App/, Engine/, Scripts/ or mise.toml change; skipping the preview build"

  revyl-preview:
    name: Revyl preview build
    # Pull requests only: the whole point is an artifact bound to a review.
    # Hoisted from the step to the job so a push to main does not spend a
    # runner on a checkout and a toolchain setup for a step that would skip.
    # The `success()` half of the old condition is gone with the move -- there
    # is no prior step in this job whose success it could mean, and gating on
    # the tests is the thing this job exists not to do.
    #
    # draft: pr_review.review_triggers.drafts is false, so Revyl would not
    # review a draft's artifact even if one arrived. Building it is spend with
    # no reader.
    #
    # fork: a pull request from a fork receives no secrets, so REVYL_API_KEY is
    # absent and the upload step takes its skip path -- but only AFTER a full
    # checkout, toolchain setup and app build have been paid for. Deciding here
    # instead makes that cost nothing. Fork contributors got no preview either
    # way; this only stops charging for the disappointment.
    needs: changed-paths
    # REVYL-PAUSED 2026-11-11: see the note on changed-paths above.
    if: >-
      false
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changed-paths.outputs.app == 'true'
    runs-on: xcode-27
    # Headroom, not a measurement: the upload step itself was measured at 2m40s
    # and 1m11s (see below) and setup at 12s warm / 3m59s cold in the job above.
    # 45 minutes is far beyond any of those and is here to stop a wedged runner
    # from burning an hour, not because anything approaches it.
    timeout-minutes: 45
    steps:
      # Plain shallow checkout, unlike helper-suites' fetch-depth: 0. That
      # job needs the build-* tags and the history behind them for its
      # release-notes smoke; nothing here does. The only git
      # reader on this path is generate-build-info.sh, which wants HEAD alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same setup the test job uses, for the same reason: this build links the
      # WoofEngine xcframework, which the action either restores from cache or
      # builds. Its deps-built output is not consulted here -- the SONiVOX
      # guards that depend on it live in the unit-tests legs and stay there.
      - uses: ./.github/actions/setup-waddle-build
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Publishes the simulator build to Revyl so a pull request has a real
      # artifact to launch a device against (.revyl/config.yaml sets
      # pr_review.build.kind: ci_upload_to_revyl, which means Revyl expects
      # the artifact from here rather than building the app itself -- a cloud
      # build would recompile the whole vendored dependency set a second time
      # having already paid for it here).
      #
      # It builds rather than reusing a test build, and that is not waste -- it
      # is also no longer avoidable, since this job no longer shares a runner
      # with the test legs. Those legs build with ENABLE_DEBUG_DYLIB at its
      # default, so their product carries Waddle.debug.dylib and
      # __preview.dylib; that is the Xcode debug-dylib layout, not a standalone
      # bundle, and it is not what should be installed on a device under test.
      # -derivedDataPath still points somewhere separate, which now costs
      # nothing to keep and documents that this tree is not the test legs'.
      # build/ is used because .gitignore already covers it -- a new top-level
      # directory would leave the tree dirty, which is precisely what
      # check-red-green.sh refuses to run against
      # (docs/learnings/fixture-stub-trips-own-dirty-tree-guard.md).
      #
      # Measured on hosted runners while this still lived inside the test job:
      # 2m40s on run 35410095359 and 1m11s on 35410545973. The spread is the
      # engine cache -- this step's own -derivedDataPath is a fresh tree every
      # time (DerivedData is cached nowhere in this repository, deliberately),
      # so the Swift compile is always cold and the rest tracks whether
      # Vendor/out was restored. Those numbers are for the xcodebuild step only
      # and do not include this job's own checkout and setup.
      #
      # If it ever grows dear, the cheap fix is the one the iPad leg
      # documents: move this to `push: main` rather than delete it.
      #
      # ARCHS=arm64 is required, not tidiness: a generic simulator destination
      # builds x86_64 too and the engine xcframework has only an arm64
      # simulator slice. See
      # docs/learnings/generic-simulator-destination-adds-x86_64.md.
      # Same pinned, verified download as the revyl-main job below, and for
      # the same reason: the step that holds REVYL_API_KEY should not also be
      # the one that runs whatever the vendor's installer says today.
      - name: Install the Revyl CLI
        run: |
          curl -fsSL -o revyl-darwin-arm64 \
            "https://github.com/RevylAI/revyl-cli/releases/download/${REVYL_VERSION}/revyl-darwin-arm64"
          echo "${REVYL_CLI_SHA256}  revyl-darwin-arm64" | shasum -a 256 -c -
          mkdir -p "$HOME/.revyl/bin"
          install -m 0755 revyl-darwin-arm64 "$HOME/.revyl/bin/revyl"
          rm -f revyl-darwin-arm64
          echo "$HOME/.revyl/bin" >> "$GITHUB_PATH"
          "$HOME/.revyl/bin/revyl" --version
      - name: Publish build to Revyl
        # Paired with pr_review.strict_ci_check.build: false in
        # .revyl/config.yaml. Neither this nor that is a permanent setting --
        # they are both "this path has never run on a real pull request", and
        # they should be flipped together once it has. Until then a Revyl-side
        # outage must not be able to fail this job.
        continue-on-error: true
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
        run: |
          # Absent on pull requests from forks, which do not receive secrets,
          # and on every run until the secret is added. Skipping is correct in
          # both cases; failing would punish a contributor for a permission
          # they cannot hold.
          if [ -z "${REVYL_API_KEY:-}" ]; then
            echo "::notice::REVYL_API_KEY is not set; skipping the Revyl upload"
            exit 0
          fi

          # SWIFT_ACTIVE_COMPILATION_CONDITIONS carries WADDLE_PROOF_HARNESS,
          # which keeps OverlayPresenter from hiding the touch overlay when
          # GameController reports an attached keyboard or gamepad. THIS is the
          # build that proof-of-changes installs -- .revyl/config.yaml sets
          # pr_review.build.kind: ci_upload_to_revyl, so its own build_commands
          # never run on the pull-request path and a flag set only there would
          # do nothing. Both carry it; Scripts/check-proof-harness-flag.sh
          # fails if either drops it. See
          # docs/learnings/revyl-proof-cannot-set-launch-env.md.
          #
          # $(inherited) must stay single-quoted: bare, the shell would run it
          # as command substitution, and without it the command-line override
          # REPLACES the Debug value instead of extending it, dropping DEBUG
          # and every `#if DEBUG` seam with it.
          xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) WADDLE_PROOF_HARNESS' \
            build

          ditto -c -k --keepParent \
            build/Build/Products/Debug-iphonesimulator/Waddle.app \
            build/Waddle.app.zip

          # --commit takes the PULL REQUEST HEAD sha. github.sha is the
          # ephemeral merge commit on a pull_request event, which exists on no
          # branch and is not what Revyl matches a review against; passing it
          # would register builds against a commit nobody can look up.
          # Without --version the CLI names the build after the clock
          # ("20260919-010233"), which identifies nothing in a list. The PR
          # number and head sha are what someone reading the dashboard
          # actually wants.
          #
          # --no-set-current is what makes running ungated safe. Nothing here
          # knows whether the unit tests passed -- the unit-tests legs are still
          # running alongside -- so this publishes previews for builds that go
          # on to fail. That is the deliberate trade: a broken build is often
          # exactly the one you want to launch on a device and watch break.
          # What must NOT happen is a red build silently becoming the app's
          # current version for everyone else, so the upload registers the
          # build and stops short of promoting it. Whoever wants this one
          # picks it by the --version string above.
          revyl build upload \
            --file build/Waddle.app.zip \
            --platform ios \
            --version "pr${{ github.event.pull_request.number }}-$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" \
            --app "8d5b0635-f1df-4a9f-8978-366771843c12" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --no-set-current \
            --yes --json

  # The pull-request preview above deliberately stops short of promoting its
  # upload (--no-set-current: nothing there knows whether the tests passed).
  # The cost of that is that the app's CURRENT build on Revyl -- the one a
  # plain `revyl test run <name>` installs -- never advances on its own. On
  # 2026-09-19 it was a hand-uploaded build from before the WADDLE_PROOF_HARNESS
  # flag existed, so a device run of menu-state-across-sessions had no touch
  # overlay to drive and could not open the in-game menu. Once one green
  # build of main has been promoted, it is by definition safe to promote:
  # it is what everyone has already merged.
  #
  # `needs:` is the gate the preview job cannot have: this runs only after
  # the helper suites and every unit-test leg passed on this exact commit, so
  # a red build never becomes current. The list is the same as the
  # `testflight` job's, for the reason given there. Everything else mirrors the preview job --
  # same runner, same setup action, same xcodebuild line with the
  # WADDLE_PROOF_HARNESS flag (Scripts/check-proof-harness-flag.sh looks for
  # that exact string), same upload -- except the version is named after
  # main's sha, there is no --pr, and there is no --no-set-current.
  revyl-main:
    name: Revyl current build
    needs: [helper-suites, unit-tests]
    # REVYL-PAUSED 2026-11-11: see the note on changed-paths above.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes or reads a private remote, so the job has no
          # use for a stored GitHub credential, and the installer step below
          # runs vendor shell it should not be able to find one next to.
          persist-credentials: false
      - uses: ./.github/actions/setup-waddle-build
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # A step of its own, with no secret in its environment, and no installer
      # script: the exact release asset, verified against REVYL_CLI_SHA256
      # (workflow env) before it can run.
      - name: Install the Revyl CLI
        run: |
          curl -fsSL -o revyl-darwin-arm64 \
            "https://github.com/RevylAI/revyl-cli/releases/download/${REVYL_VERSION}/revyl-darwin-arm64"
          echo "${REVYL_CLI_SHA256}  revyl-darwin-arm64" | shasum -a 256 -c -
          mkdir -p "$HOME/.revyl/bin"
          install -m 0755 revyl-darwin-arm64 "$HOME/.revyl/bin/revyl"
          rm -f revyl-darwin-arm64
          echo "$HOME/.revyl/bin" >> "$GITHUB_PATH"
          "$HOME/.revyl/bin/revyl" --version
      - name: Publish main to Revyl as the current build
        env:
          REVYL_API_KEY: ${{ secrets.REVYL_API_KEY }}
        run: |
          if [ -z "${REVYL_API_KEY:-}" ]; then
            echo "::notice::REVYL_API_KEY is not set; skipping the Revyl upload"
            exit 0
          fi
          xcodebuild -project App/Waddle.xcodeproj -scheme Waddle \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) WADDLE_PROOF_HARNESS' \
            build
          ditto -c -k --keepParent \
            build/Build/Products/Debug-iphonesimulator/Waddle.app \
            build/Waddle.app.zip
          revyl build upload \
            --file build/Waddle.app.zip \
            --platform ios \
            --version "main-$(echo '${{ github.sha }}' | cut -c1-7)" \
            --app "8d5b0635-f1df-4a9f-8978-366771843c12" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --yes --json

  # Ships the merge to TestFlight. `needs:` is the whole of the gate on
  # quality: this runs only after the helper suites and every unit-test leg
  # passed on this exact commit, so a red build never reaches a tester.
  #
  # Both names are load-bearing, and the list must grow with the jobs. What
  # used to be one job, and so one name here, is now two: `helper-suites` and
  # the `unit-tests` matrix, which stands for all of its legs -- a `needs:` on
  # a matrix job is satisfied only when every leg succeeded. A leg that
  # failed or was cancelled (issue #415) leaves this job skipped, because the
  # `if:` below calls no status function and so keeps its implicit
  # `success()`; do not add `always()` or `!cancelled()` to it. A test job
  # added to this workflow and not to this list would be a check a release
  # does not wait for. Scripts/check-release-gate.sh refuses both mistakes.
  #
  # Re-running a failed or cancelled leg re-runs this job after it, on that
  # run's commit. That is the intended recovery when the run is main's newest.
  # On an OLDER run, after a later one has shipped, it would have uploaded the
  # older commit as the newest build; Scripts/release-due.sh now answers `no`
  # for a commit behind the newest build-* tag, so such a re-run goes green
  # and ships nothing.
  #
  # The called workflow's own first job then decides whether anything that goes into the binary changed
  # since the last shipped build (Scripts/release-due.sh), so a docs-only or
  # test-only merge costs no macOS runner and sends no notification.
  #
  # `uses:` rather than more steps here, so the release lane keeps one
  # definition for the merge path and the hand-dispatched path (dry runs,
  # retries, the cases the gate cannot see from git).
  testflight:
    needs: [helper-suites, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Read only: the called workflow pushes its build-N tag with
    # RELEASE_TAG_TOKEN rather than the job token (see testflight.yml's
    # permissions note), so nothing in it needs more than the workflow-level
    # grant. Stated anyway, because the caller's grant is the ceiling of what
    # the called workflow may hold and that ceiling should be visible here.
    permissions:
      contents: read
    # The same group testflight.yml declares, because a called workflow's own
    # concurrency is not guaranteed to apply. Two merges in quick succession
    # release one after the other; a dispatch waits for a merge in flight,
    # and queue: max is what keeps it waiting instead of being cancelled by
    # the merge after that (see the note on testflight.yml's concurrency).
    concurrency:
      group: testflight
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/testflight.yml
    # A called workflow receives NO secrets unless the caller passes them,
    # and that is true even though the called job declares the `app-store`
    # environment: the environment decides which VALUES the names resolve to,
    # the caller decides whether the names arrive at all. The first on-merge
    # release (run 37060983966) ran with every secret empty for want of this
    # line. `inherit` rather than a named list because the names are the
    # called workflow's business and the environment's branch rule, not this
    # list, is what keeps them from a branch.
    # Scripts/check-called-workflow-secrets.sh refuses the line's absence.
    secrets: inherit
