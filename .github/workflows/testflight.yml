name: TestFlight

# Scheduled nightly, plus manual dispatch. The rule this used to state --
# "shipping is a deliberate act and must never be a side effect of a push or a
# tag" -- is narrowed here, not dropped, and the narrowing is only in the word
# "push". No individual merge ships anything, and no tag ships anything. What
# ships is one scheduled act per day, carrying whatever main accumulated, and
# only when main actually moved past the newest build-* tag (the `gate` job
# below, via Scripts/release-due.sh).
#
# Per-merge releases were the alternative and were rejected on the numbers: at
# the two or three merged pull requests a day this repo lands, they would mean
# three builds daily whose What-to-Test notes are each a single bullet, which
# teaches testers to ignore the notification. Once ignored, the notification
# cannot be un-ignored by shipping more often.
on:
  schedule:
    # 01:17 America/Los_Angeles in winter, 02:17 in summer -- cron has no
    # timezone and GitHub reads it as UTC. Deliberately off the hour: schedules
    # bunch at :00, and a contended queue delays them, sometimes past an hour.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate the build without uploading (does not consume a build number)
        type: boolean
        required: false
        default: false
      build_number:
        description: Override the derived build number (use when retrying a release)
        type: string
        required: false
        default: ''

# Ref-INDEPENDENT on purpose: a ref-keyed group (as ci.yml uses) would not
# serialize two dispatches on different refs, which is the exact race this
# prevents. cancel-in-progress is false because cancelling mid-upload burns a
# build number server-side while reporting nothing.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.2"
  # Builds 1-6 are consumed. run_number starts at 1 for a new workflow, so
  # this floor clears them with room for out-of-band manual uploads. First CI
  # release is 201. Documented in the design spec.
  #
  # Since the nightly schedule landed, build numbers have GAPS: a night the
  # gate declines still consumes a run_number, so the sequence skips. That is
  # harmless -- App Store Connect requires build numbers to be unique and
  # increasing, never contiguous -- but it means a missing number is not
  # evidence of a lost or failed release, and the run list is the only place
  # that distinction is recorded.
  BUILD_NUMBER_OFFSET: 200

jobs:
  # Deliberately a separate ubuntu job rather than a first step of the macOS
  # one. Two things follow from the split and neither is cosmetic: a quiet
  # night never spins up a macOS runner at all, and a declined night reads as
  # `skipped` in the run list instead of as a green run that silently did
  # nothing -- the shape that makes a broken schedule indistinguishable from a
  # calm week.
  gate:
    name: Anything to ship?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ship: ${{ steps.due.outputs.ship }}
    # Declared for the same reason the release job declares its own, and to
    # answer the case that comment anticipates ("every job added here later"):
    # without this, a job added to a release workflow silently inherits
    # whatever the repository default happens to be. This one only ever reads
    # local history, so read is the whole of what it needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same reason as the release job below, and the same trap:
          # Scripts/release-due.sh measures from the newest build-* tag, and a
          # depth-1 clone has neither the tag nor the history behind it. The
          # script fails closed rather than guessing if this is ever dropped,
          # but the point is to not put it in that position.
          fetch-depth: 0
          # No authenticated git here. Scripts/release-due.sh runs `describe`,
          # `rev-list` and `tag -l` and nothing else -- every one of them a
          # local read -- so leaving the token in the checkout's git config
          # would be handing out reach this job never uses. The release job
          # below keeps its credentials: it pushes the build-* tag.
          persist-credentials: false

      - name: Ask whether main moved
        id: due
        env:
          # A manual dispatch is the owner meaning it, and the schedule's gate
          # must not second-guess that. Re-releasing after a failed notes
          # attach, and shipping an engine rebuild that changes the binary with
          # no new commits behind it, are both legitimate and both look exactly
          # like "nothing to ship" when measured from git alone.
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: shipping regardless of what main has done."
            exit 0
          fi
          # Status tested before the output is read. A masked failure here
          # would surface as an empty string, which compares unequal to "yes"
          # and would silently stop releasing forever -- a failure that looks
          # exactly like a quiet week. See
          # docs/learnings/masked-exit-status-fails-open.md.
          if ! DUE="$(Scripts/release-due.sh)"; then
            echo "::error::Could not determine whether a release is due; refusing to ship blind."
            exit 1
          fi
          if [ "$DUE" = "yes" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
            echo "main has moved since the last shipped build; releasing."
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "No commits since the newest build-* tag; nothing to ship tonight."
          fi

  testflight:
    name: Archive and upload
    needs: gate
    if: ${{ needs.gate.outputs.ship == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    # Declared on the JOB, not the workflow: written at workflow level it
    # would grant write access to every job added here later, which is not
    # what the comment claims or what this needs. contents: write exists for
    # the "Tag the shipped build" step's `git push origin build-<N>` and
    # nothing else -- every other step here only reads.
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 (all history, all branches/tags), not the default
      # shallow depth-1 clone: Scripts/whats-to-test.sh anchors its changelog
      # on the newest build-* tag and walks `git log` over the range since
      # it. A depth-1 checkout has neither the tag nor the history behind it,
      # so the script would silently take its once-ever bootstrap fallback
      # (last 20 commits) on every run instead of the true range -- a green
      # run that quietly ships the wrong notes. Same reasoning as ci.yml's
      # fetch-depth: 0 for `git merge-base`; this repo's history is small
      # enough that the unshallow fetch costs well under a second.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Fails in seconds. Without it a bad value costs a ~25 minute build
      # before App Store Connect rejects it.
      - name: Resolve and validate the build number
        id: buildnum
        env:
          OVERRIDE: ${{ inputs.build_number }}
          OFFSET: ${{ env.BUILD_NUMBER_OFFSET }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$OVERRIDE" ]; then N="$OVERRIDE"; else N=$(( OFFSET + RUN_NUMBER )); fi
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "::error::build number '$N' is not numeric"; exit 1; }
          [ "$N" -gt 6 ] || { echo "::error::build number $N is at or below the consumed 1-6"; exit 1; }
          echo "value=$N" >> "$GITHUB_OUTPUT"
          echo "Build number: $N"

      - uses: ./.github/actions/setup-waddle-build
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          # Rebuild from source: a cached framework cannot be vouched for.
          skip-cache: 'true'

      # No set -x anywhere in this step. A decoded .p8 is multi-line PEM and
      # GitHub's masking needs a single-line exact match, so it would NOT be
      # redacted if it reached the log.
      - name: Install signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          umask 077
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          CERT="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          # Explicit /usr/bin/base64: bare `base64` is PATH-shadowable, and
          # this repo has already been burned by exactly that failure mode --
          # a Homebrew rsync shadowing /usr/bin/rsync broke
          # `xcodebuild -exportArchive` (see archive.sh's PATH handling).
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$CERT"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 --decode > "$PROFILE"
          printf '%s' "$ASC_PRIVATE_KEY" | /usr/bin/base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$CERT" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Append rather than replace -- `-s` alone drops login.keychain.
          # shellcheck disable=SC2046 # word splitting is intentional: -s takes one path per word
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # codesign: is REQUIRED. Without it macOS queues a GUI authorization
          # prompt that never arrives headless, and the job HANGS until the
          # timeout rather than failing. The shorter apple-tool:,apple: form
          # found in older guides is insufficient.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KC_PW" "$KC" >/dev/null

          UUID="$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)"
          # Both locations: Xcode 16+ reads the Developer/Xcode path, older
          # tooling still reads the MobileDevice one. Installing to only the
          # legacy path is why this failed with "No profiles ... were found".
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          # Scoped to $KC deliberately: the search-list-wide form would pass on
          # ANY Apple Distribution identity, masking a broken or key-less .p12.
          # Search-list membership is asserted separately just below, since that
          # is what codesign actually consults.
          if ! security find-identity -v -p codesigning "$KC" | grep -q 'Apple Distribution'; then
            echo "::error::No Apple Distribution identity in the ephemeral keychain."
            echo "  The .p12 may be missing its private key, or the certificate may have expired."
            echo "  If the certificate was renewed, regenerate the BUILD_CERTIFICATE_BASE64"
            echo "  and P12_PASSWORD secrets. See docs/app-store/submission-checklist.md."
            security find-identity -v -p codesigning "$KC" || true
            exit 1
          fi
          if ! security list-keychains -d user | grep -qF "$KC"; then
            echo "::error::$KC is not in the user keychain search list; codesign will not find the identity."
            security list-keychains -d user || true
            exit 1
          fi

      - name: Archive and export
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.value }}
          EXPORT_OPTIONS_PLIST: App/ExportOptions-ci.plist
        run: Scripts/archive.sh

      # BEFORE the upload, so a failed upload does not discard the build.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WADdle-${{ steps.buildnum.outputs.value }}-ipa
          path: Vendor/archive/export/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          if [ "$VALIDATE_ONLY" = "true" ]; then
            Scripts/upload.sh --validate
          else
            Scripts/upload.sh
          fi

      # Tag BEFORE attaching notes, and only on a real upload. The tag records
      # what shipped, and the NEXT release computes its changelog range from
      # it. If the tag were gated on the notes succeeding, a notes failure
      # would leave the next release anchored on an older build and silently
      # re-list changes already delivered. A push failure here is at least as
      # load-bearing as a notes failure below -- if the tag never lands, the
      # NEXT release anchors on the previous or bootstrap tag and silently
      # re-lists changes already shipped, so it fails loudly for the same
      # reason the notes step does.
      - name: Tag the shipped build
        if: ${{ inputs.validate_only != true }}
        env:
          N: ${{ steps.buildnum.outputs.value }}
        run: |
          if ! git tag "build-$N" || ! git push origin "build-$N"; then
            echo "::error::Build $N IS UPLOADED and the release did NOT fail --"
            echo "::error::only the build-$N tag could not be recorded (a"
            echo "::error::tag-protection ruleset or a transient push failure)."
            echo "::error::Re-running this workflow will NOT fix this: a retry"
            echo "::error::reuses the same run number, computes the same build"
            echo "::error::number, and would tag the wrong build if it even got"
            echo "::error::this far again -- it would instead be rejected earlier,"
            echo "::error::at upload, since App Store Connect rejects a duplicate"
            echo "::error::build. Create and push the tag by hand instead:"
            echo "::error::  git -c tag.gpgSign=false tag build-$N \\"
            echo "::error::    && git push origin build-$N"
            echo "::error::(the -c is not optional on a machine with tag.gpgSign"
            echo "::error::set: a lightweight tag then fails with the misleading"
            echo "::error::'fatal: no tag message?' -- see"
            echo "::error::docs/learnings/git-fixtures-inherit-signing-config.md)"
            exit 1
          fi

      # Notes are metadata: a failure here does NOT mean the release failed.
      # It fails the job anyway, loudly, because a silent warning is how the
      # field ends up empty -- which is the entire reason this exists.
      - name: Attach What to Test notes
        if: ${{ inputs.validate_only != true }}
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          N: ${{ steps.buildnum.outputs.value }}
        run: |
          if ! Scripts/whats-to-test.sh "$N"; then
            echo "::error::Build $N IS UPLOADED and the release did NOT fail --"
            echo "::error::only the What-to-Test notes could not be attached."
            echo "::error::Re-running this workflow will REBUILD AND UPLOAD AGAIN,"
            echo "::error::consuming another build number. The build_number input"
            echo "::error::cannot avoid that: App Store Connect rejects a duplicate."
            echo "::error::Set the notes by hand in App Store Connect instead."
            exit 1
          fi

      # Raw xcodebuild (no fastlane) writes these into TMPDIR, NOT
      # ~/Library/Logs/gym. Copied into RUNNER_TEMP first because
      # upload-artifact cannot glob a path outside the workspace reliably.
      - name: Collect distribution logs
        if: failure()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/distlogs"
          cp -R "$TMPDIR"/*.xcdistributionlogs "$RUNNER_TEMP/distlogs/" 2>/dev/null || true
          # Artifact contents are NOT covered by GitHub's secret masking, and
          # this is a public repo. The logs embed the ASC key id via the
          # -authenticationKeyPath argument, so scrub it before publishing.
          if [ -n "${ASC_KEY_ID:-}" ]; then
            find "$RUNNER_TEMP/distlogs" -type f -print0 2>/dev/null \
              | xargs -0 -r sed -i '' "s/${ASC_KEY_ID}/ASC_KEY_ID_REDACTED/g" 2>/dev/null || true
          fi
          ls -la "$RUNNER_TEMP/distlogs" || true

      # Failure only, short retention: these logs can contain the ASC key id
      # and account emails, and artifact CONTENTS are not covered by GitHub's
      # secret masking -- on a public repo they are publicly downloadable.
      - name: Upload distribution logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcdistributionlogs
          path: ${{ runner.temp }}/distlogs
          retention-days: 3
          if-no-files-found: ignore

      # Unconditional: if a build number was consumed, the run must say so
      # even on failure. App Store Connect is the only other record.
      - name: Summary
        if: always()
        env:
          REF: ${{ github.ref_name }}
          BUILD_NUM: ${{ steps.buildnum.outputs.value }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          if [ "$VALIDATE_ONLY" = "true" ]; then MODE="validate only"; else MODE="upload"; fi
          {
            echo "### TestFlight run"
            echo ""
            echo "- Build number: **$BUILD_NUM**"
            echo "- Mode: $MODE"
            echo "- Ref: \`$REF\`"
            echo ""
            echo "Confirm the build appears in App Store Connect. Xcode 26's altool"
            echo "can report success for an upload that did not happen, so a green"
            echo "run is not by itself proof of delivery."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete keychain and signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/profile.mobileprovision
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
