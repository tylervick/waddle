name: UI Tests

# Runs on every merge to main, and on manual dispatch. These tests boot a real
# Metal/OpenGL engine session in the simulator, so they are the slow,
# flake-prone half of the suite and stay off the pull-request path -- but they
# no longer run only when somebody remembers.
#
# The previous header said "Manual dispatch only, by choice" and closed with
# "add a `schedule:` block here if they start to rot." They rotted; this is that
# block, arriving after the rot rather than before it.
#
# Why this exists: ui-tests.yml was workflow_dispatch-only, and between its last
# run (2026-07-29) and 2026-08-16, 84 pull requests merged. One of them, PR #144,
# replaced the whole app shell and touched five UI suites. None of them ran. A
# regression in it -- long-press to Details never opening the detail sheet --
# merged, shipped to TestFlight, and was found weeks later by accident. Two UI
# tests had been red on main the entire time with no red check anywhere.
#
# Why `push: main` rather than `pull_request`: this suite boots the real engine
# on top of a full build, on a macOS runner. Paying that on every push to every
# pull request buys the ability to block the breaking merge; paying it once per
# merge tells you within minutes instead, which is what the failure above
# actually needed. Deliberately weaker and much cheaper. Revisit if something
# breaks that a post-merge signal catches too late.
#
# No `concurrency:` block on purpose. ci.yml has one and exempts main from
# cancellation for a cache reason that does not apply here, but the reason to
# omit it entirely is attribution: two merges landing close together should
# produce two runs, so a red one names the merge that broke it. Cancelling the
# older run would hand you a red result covering an unknown span of commits --
# the exact ambiguity a nightly cron would have had.
on:
  push:
    branches: [main]
  # A SMOKE SUBSET on pull requests that touch the shell (see the "Run UI
  # tests" step for which classes): nothing used to exercise WaddleUITests
  # before merge, so the wordmark bar, the game page hero and the rename flow
  # were all first driven on main (docs/learnings/ui-test-failures-need-a-
  # main-baseline.md). Path-filtered so a docs- or script-only pull request
  # does not spend a macOS runner on it; the full suite still runs on every
  # push to main.
  pull_request:
    paths:
      - App/Sources/**
      - App/UITests/**
      - App/Assets.xcassets/**
      - App/project.yml
  # The iPad leg (issue #519), nightly as well as on every push to main.
  # Three UI tests had hard-coded an iPhone's geometry and failed on every
  # iPad run, and nothing noticed: no job ran WaddleUITests on an iPad. The
  # owner chose this cadence over every pull request (2026-11-24): a macOS
  # runner per main push, plus a night's run to catch what changes under an
  # unchanged tree (runner image, simulator runtime). The schedule runs only
  # the iPad leg; the "Pick this leg's simulator" step says why.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      leg:
        description: Which leg to run (the iPad leg ignores `device`)
        type: choice
        options: [iPhone, iPad]
        default: iPhone
      device:
        description: Simulator device name, for the iPhone leg
        required: false
        default: "iPhone 18 Pro"
      only_testing:
        description: >-
          Optional -only-testing filter, e.g. WaddleUITests/EngineSmokeTests.
          Leave blank to run the whole suite except RealWADTests.
        required: false
        default: ""

# This workflow only ever reads the repo; it never needs to write anything.
permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight; main's
# own runs are never cancelled. The nightly run has a group of its own, so it
# never stands in a queue where a main push's pending run would replace it.
concurrency:
  group: ui-tests-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "27.1"
  # 27.0, not 27.1, and iPhone 18 Pro, not 17 Pro: both for the reasons given
  # beside the same two pins in ci.yml. The 27.1 simulator runtime runs only
  # iPhone Duo, and the xcode-27 image ships no iPhone 17 Pro.
  SIMULATOR_OS: "27.0"
  # The fallback for every trigger that is not workflow_dispatch. `inputs` is
  # populated ONLY for dispatch (and workflow_call); on a `push` run the whole
  # context is empty, so `inputs.device` is "". Without this, DESTINATION built
  # to `platform=iOS Simulator,name=,OS=26.2` and the job failed on a malformed
  # destination -- a failure that looks like a broken test suite and is not one.
  # The dispatch input keeps its own default so the form still shows a value.
  SIMULATOR_DEVICE: "iPhone 18 Pro"

jobs:
  ui-tests:
    # The phone leg keeps the job's old name, so its check reads as before.
    name: ${{ matrix.leg == 'iPhone' && 'UI tests' || format('UI tests ({0})', matrix.leg) }}
    runs-on: xcode-27
    # The iPad's full suite took 84 minutes end to end on its first run
    # (74 of them in "Run UI tests"; 93 tests, 2026-11-24), against the
    # phone's 80, so 90 left it six minutes of headroom. Headroom, not a
    # measurement.
    timeout-minutes: ${{ matrix.leg == 'iPad' && 120 || 90 }}
    strategy:
      # Each leg's verdict is its own: a red iPhone run must not cancel the
      # iPad's, or a device-specific failure would hide behind it.
      fail-fast: false
      matrix:
        # Which legs this event runs. A pull request runs the phone's shell
        # smoke only; a push to main runs the full suite on both devices;
        # the nightly runs the iPad alone, because main's pushes already
        # cover the phone and the night is for the device nobody runs by
        # hand; a dispatch runs the leg it names.
        leg: ${{ fromJSON(github.event_name == 'push' && '["iPhone","iPad"]' || github.event_name == 'schedule' && '["iPad"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.leg) || '["iPhone"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-waddle-build
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # The leg's device, from the pins everything else reads. The iPad's
      # name comes from Scripts/ensure-ipad-simulator.sh, the single owner of
      # its device type, so this file carries no copy of it to drift. An
      # unknown leg fails rather than falling back to the phone: a leg that
      # quietly tested the wrong device would be green. inputs.device goes
      # through env for the same shell-injection reason as ONLY_TESTING
      # below.
      - name: Pick this leg's simulator
        env:
          LEG: ${{ matrix.leg }}
          INPUT_DEVICE: ${{ inputs.device }}
        run: |
          case "$LEG" in
            iPhone) device="${INPUT_DEVICE:-$SIMULATOR_DEVICE}"; suffix="" ;;
            iPad) device="$(Scripts/ensure-ipad-simulator.sh --name)"; suffix="-ipad" ;;
            *) echo "::error::no simulator is pinned for the leg \"$LEG\""; exit 1 ;;
          esac
          [ -n "$device" ] || { echo "::error::the leg \"$LEG\" has no device"; exit 1; }
          {
            echo "SIM_DEVICE=$device"
            echo "ARTIFACT_SUFFIX=$suffix"
          } >> "$GITHUB_ENV"

      # Same rationale as ci.yml's identical step: confirm the destination
      # actually exists before spending the run on it, using the same
      # device/OS values DESTINATION uses below. See
      # docs/learnings/simulator-enumeration-race.md.
      #
      # The iPad is created on demand rather than pre-provisioned, as in
      # ci.yml's iPad leg; the phone is checked first there for the reason
      # given beside it (a cold runner's empty enumeration would make the
      # ensure script create a duplicate).
      - name: Verify simulator is available
        env:
          LEG: ${{ matrix.leg }}
        run: |
          if [ "$LEG" = iPad ]; then
            Scripts/check-simulator-available.sh "$SIMULATOR_DEVICE" "$SIMULATOR_OS"
            Scripts/ensure-ipad-simulator.sh "$SIMULATOR_OS" > /dev/null
          fi
          Scripts/check-simulator-available.sh "$SIM_DEVICE" "$SIMULATOR_OS"

      # Issues #386 and #396: a fresh runner's simulator renders every
      # lock-screen wallpaper once, and the runner is too busy to launch an app
      # on time while it does. Left to xcodebuild, the boot lands that work on
      # the first test, or (when the host has been up under ten minutes) the
      # simulator defers it into the middle of the session. This step boots the
      # device itself and waits, by condition, until the renders are done; its
      # WADDLE_SIMULATOR_SETTLED / WADDLE_SIMULATOR_NOT_SETTLED line says which
      # kind of run this was. It costs minutes on every run; the script's
      # header and docs/learnings/ui-test-launch-flakes-and-the-wallpaper-
      # gallery.md say why that is the price.
      - name: Boot the simulator and wait for it to settle
        id: simulator
        run: Scripts/prepare-ui-test-simulator.sh "$SIM_DEVICE" "$SIMULATOR_OS"

      # Inputs go through env rather than direct ${{ }} interpolation into
      # the script body, so a value containing shell metacharacters cannot
      # break out of the command.
      - name: Run UI tests
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          ARGS=(
            -project App/Waddle.xcodeproj
            -scheme Waddle
            -destination "platform=iOS Simulator,name=$SIM_DEVICE,OS=$SIMULATOR_OS"
            -resultBundlePath UITestResults.xcresult
          )
          # RealWADTests needs Scythe / Sunlust / Eviternity II from
          # ~/Downloads/doom-test-wads -- non-redistributable and ~300 MB, so it
          # can NEVER run here, whatever filter was requested. Applied
          # unconditionally rather than only on the default path: a dispatch of
          # only_testing=WaddleUITests would otherwise pull it back in. Skipping
          # a test that the filter never selected is a harmless no-op.
          ARGS+=(-skip-testing:WaddleUITests/RealWADTests)
          if [ -n "$ONLY_TESTING" ]; then
            ARGS+=(-only-testing:"$ONLY_TESTING")
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The shell smoke: the screens the design system and the shelf's
            # layout model draw, and the flows whose identifiers and copy the
            # UI tests pin. No engine session is started by any of these, so
            # the subset finishes in minutes; EngineSmokeTests, the session
            # state probes and the touch tests stay on main's full run.
            ARGS+=(-only-testing:WaddleUITests/PlayTabTests)
            ARGS+=(-only-testing:WaddleUITests/GamePageTests)
            ARGS+=(-only-testing:WaddleUITests/FilesScreenTests)
            ARGS+=(-only-testing:WaddleUITests/HiddenGamesScreenTests)
            ARGS+=(-only-testing:WaddleUITests/ShipUITests)
          else
            ARGS+=(-only-testing:WaddleUITests)
          fi
          xcodebuild "${ARGS[@]}" test

      # The simulator's own log, on every run. A result bundle carries it only
      # when a test failed, which is why nobody could say how a launch behaves
      # in a run that passes. The step prints the wallpaper-render timeline and
      # every app launch's lag to the job log; the archive is uploaded below.
      # A measurement, so it never decides the job's result.
      - name: Collect the simulator log
        if: always() && steps.simulator.outputs.udid != ''
        continue-on-error: true
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
        run: Scripts/ui-test-launch-report.sh "$SIM_UDID" UITestResults.xcresult simulator-log

      # The phone's artifacts keep their old names; the iPad's carry a suffix
      # so the two legs of one run do not collide.
      - name: Upload simulator log
        if: always() && steps.simulator.outputs.udid != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulator-log${{ env.ARTIFACT_SUFFIX }}
          path: simulator-log
          retention-days: 7

      # Always, not just on failure: a passing UI run is also the artifact
      # you want when checking whether a flake reproduced.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-test-results${{ env.ARTIFACT_SUFFIX }}
          path: UITestResults.xcresult
          retention-days: 7
