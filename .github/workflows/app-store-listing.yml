# Writes the App Store listing text of one version -- description, What's New,
# promotional text, keywords, App Review notes -- from docs/app-store/listing/,
# and optionally selects its build, via Scripts/update-store-listing.sh.
#
# Manual only, and a DRY RUN unless `apply` is ticked: the dry run prints a
# diff of App Store Connect against the repo, field by field, and changes
# nothing. Run it first.
#
# Runs from main only, dry runs included: the job's `app-store` environment
# admits no other branch, and that environment is where the key lives. The text
# that reaches the store is the reviewed, merged text, not a branch's.
name: App Store listing

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the listing to App Store Connect (unticked = dry run)
        type: boolean
        required: false
        default: false
      version:
        description: App Store version, e.g. 1.2 (default = MARKETING_VERSION in App/project.yml)
        type: string
        required: false
        default: ''
      build:
        description: Build number to select for the version, e.g. 264 (blank = leave as is)
        type: string
        required: false
        default: ''

# Shares the screenshots workflow's group: both write the same version, and a
# listing write racing a screenshot swap is nothing anyone needs.
concurrency:
  group: app-store-screenshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listing:
    name: Listing
    runs-on: ubuntu-latest
    # The App Store Connect key and the signing material are secrets of the
    # `app-store` environment, which only `main` may deploy to. That is what
    # keeps them from a branch: a workflow_dispatch runs the DISPATCHED ref's
    # copy of this file, so any in-file "main only" check is one a branch can
    # simply delete.
    environment: app-store
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" | /usr/bin/base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

      - name: Write the listing (or dry run)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          APPLY: ${{ inputs.apply }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          # The tee below must not swallow the script's exit status.
          set -o pipefail
          set --
          if [ "$APPLY" = "true" ]; then set -- "$@" --apply; fi
          if [ -n "$VERSION" ]; then set -- "$@" --version "$VERSION"; fi
          if [ -n "$BUILD" ]; then set -- "$@" --build "$BUILD"; fi
          Scripts/update-store-listing.sh "$@" | tee "$RUNNER_TEMP/listing.log"
          {
            echo "## App Store listing"
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/listing.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
