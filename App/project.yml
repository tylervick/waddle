name: Waddle
options:
  bundleIdPrefix: com.tylervick
  deploymentTarget:
    iOS: "26.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_LDFLAGS: "-lc++"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Personal team (OU of the "Apple Development: Tyler Vick" cert) —
    # xcodegen regenerates the project, which would wipe a team set by hand
    # in Xcode's Signing pane.
    DEVELOPMENT_TEAM: 352UZEKYPP
  # Signing style is per-configuration, and the split is deliberate.
  #
  # Debug stays Automatic so device runs keep signing themselves — Xcode
  # resolves (and silently re-issues) its own managed development profile,
  # including adding a newly connected device's UDID. Nothing about local
  # development changes.
  #
  # Release is Manual because CI archives with no signed-in Xcode account.
  # It cannot be Automatic there: automatic signing resolves profiles by
  # talking to the developer portal, and the only way to let it do that is
  # -allowProvisioningUpdates, which also permits xcodebuild to MINT a new
  # Apple Distribution certificate on a resolution miss. Apple caps those at
  # 2–3 per account and the only cleanup is manual revocation in the portal —
  # the one irreversible failure mode in this pipeline.
  #
  # The Release profile must therefore be MANUALLY managed: Xcode refuses an
  # Xcode-managed profile under Manual signing ("is Xcode managed, but signing
  # settings require a manually managed profile"). "WADdle App Store CI" was
  # created by hand at developer.apple.com for exactly this reason; the
  # Xcode-managed "iOS Team Store Provisioning Profile" cannot be used here.
  # It is installed on the runner from the PROVISIONING_PROFILE_BASE64 secret
  # and expires 2027-05-02, the same day as the certificate it is bound to
  # (a profile cannot outlive its certificate).
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
    Release:
      CODE_SIGN_STYLE: Manual
      # Named for the profile as it exists in Apple's developer portal, which
      # still carries the pre-2026-08-16 spelling. This string is not ours to
      # restyle: it must match the portal exactly or the archive fails to
      # resolve a profile, with an error that names neither. Rename it in the
      # portal first, at the next regeneration, then here.
      PROVISIONING_PROFILE_SPECIFIER: "WADdle App Store CI"
      CODE_SIGN_IDENTITY: "Apple Distribution"
targets:
  Waddle:
    type: application
    platform: iOS
    settings:
      base:
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The one accent of spec §5's visual system, named once in the
        # asset catalog (App/Assets.xcassets/AccentColor.colorset). Setting it
        # globally rather than tinting a view tree is what reaches the system
        # controls the shell does not draw itself — sheet confirmation buttons,
        # the document picker, context menus.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.tylervick.waddle
      # XcodeGen's built-in application_iOS setting preset injects
      # CODE_SIGN_IDENTITY=iPhone Developer at this same (target) scope, and a
      # target-level setting beats the project-level one. Under Automatic that
      # is inert (Xcode resolves the identity itself), which is why Debug needs
      # no override here — but under Release's Manual signing it would silently
      # shadow "Apple Distribution" with a decade-retired identity name that
      # matches no certificate on this account. Re-assert Release only.
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
    # Document-type registration (CFBundleDocumentTypes +
    # UTImportedTypeDeclarations, needed for "Share -> Open in Waddle" on
    # .wad files) is nested-dictionary plist content with no INFOPLIST_KEY_
    # build-setting mapping, so this target needs a real Info.plist. XcodeGen
    # writes it to App/Info.plist at `xcodegen generate` time (same lifecycle
    # as the .xcodeproj); it's gitignored alongside it.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Waddle
        # Wire the bundle version/build number to the build settings above so
        # they're the single source of truth. Without these, xcodegen writes a
        # hardcoded CFBundleVersion of "1" and bumping CURRENT_PROJECT_VERSION
        # has no effect (App Store rejects a re-used build number).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # No encryption beyond what the OS provides (no HTTPS calls, no
        # crypto) — lets App Store Connect skip the export-compliance
        # question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        # Wireless game controllers connect over Bluetooth; SDL's controller
        # support references CoreBluetooth, so App Store validation requires
        # this purpose string (ITMS-90683). Honest — this is a real feature.
        NSBluetoothAlwaysUsageDescription: Waddle uses Bluetooth to connect wireless game controllers.
        # All orientations + no UIRequiresFullScreen: required for iPadOS 26's
        # default "Windowed Apps" multitasking style (the old landscape-only +
        # fullscreen posture rendered sideways-letterboxed there, and Xcode
        # warns UIRequiresFullScreen will soon be ignored). SDL's iOS backend
        # feeds rotation/window resizes to Woof! as resize events, so the game
        # letterboxes to whatever shape it's given.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Doom WAD
            LSHandlerRank: Owner
            LSItemContentTypes: [com.tylervick.waddle.wad]
          - CFBundleTypeName: DeHackEd Patch
            LSHandlerRank: Owner
            LSItemContentTypes: [com.tylervick.waddle.deh]
          - CFBundleTypeName: Zip Archive
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.tylervick.waddle.wad
            UTTypeDescription: Doom WAD
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wad]
          - UTTypeIdentifier: com.tylervick.waddle.deh
            UTTypeDescription: DeHackEd Patch
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [deh, bex]
    preBuildScripts:
      - name: Generate Build Info
        # Regenerates App/Sources/Generated/BuildInfo.generated.swift with
        # the current commit/branch/build time before every build (see
        # Scripts/generate-build-info.sh's header for why a *placeholder*
        # must also exist before the first `xcodegen generate`, or this
        # file never gets picked up at all). `outputFiles` tells Xcode this
        # phase produces that file, so it's sequenced before compilation.
        script: |
          "$SRCROOT/../Scripts/generate-build-info.sh"
        outputFiles:
          - $(SRCROOT)/Sources/Generated/BuildInfo.generated.swift
    sources:
      # Generated/BuildInfo.generated.swift is excluded from this recursive
      # scan and given its own explicit `optional: true` entry below
      # instead: XcodeGen's directory scan is a static file list snapshotted
      # at `xcodegen generate` time, so on a clean checkout (file missing --
      # it's gitignored, produced by Scripts/generate-build-info.sh) it
      # would simply not exist in the project, and the preBuildScripts
      # phase further down would then be writing into a file the compiler
      # never sees -- "no such source file" wasn't the failure mode found,
      # it silently succeeded and BuildInfo just wasn't in Compile Sources,
      # so every reference to `BuildInfo.*` failed to compile. An explicit
      # `optional: true` source entry, by contrast, always reserves a
      # Compile Sources slot for that exact path, present or not at
      # generate time -- so the pre-build script's freshly generated file
      # lands somewhere Xcode already agreed to compile. Listing it twice
      # (once from the recursive scan, once explicitly) would risk a
      # duplicate Compile Sources entry once the file exists, hence the
      # exclude here.
      - path: Sources
        excludes:
          - Generated/BuildInfo.generated.swift
      - path: Sources/Generated/BuildInfo.generated.swift
        optional: true
      - path: Assets.xcassets
      # The app icon is an Icon Composer package, not an .appiconset. With a
      # deployment target of iOS 26 there is nothing to fall back to, and the
      # retired 20/29/40/60/76/83.5 size matrix has no role: a .icon holds the
      # artwork once and the OS renders Default/Dark/Clear/Tinted from it,
      # supplying the squircle, the drop shadow, and the glass specular itself.
      # That is why AppIcon.icon/Assets/mark.png is the bare subject on
      # transparency -- the white card and cast shadow in the source render are
      # stripped during extraction so we do not double up on the system's.
      #
      # Basename must match ASSETCATALOG_COMPILER_APPICON_NAME (AppIcon) above.
      # Regenerate the artwork with `mise run icons`.
      - path: AppIcon.icon
      # NOTE: deliberately Resources/GameData, not Resources. A folder
      # reference whose bundle-root name is literally "Resources" makes
      # Xcode emit macOS-style Contents/Resources codesign rules
      # (`^Resources/` in _CodeSignature/CodeResources) even for an iOS
      # target. That makes codesign classify the bundle as "bundle"
      # instead of "app bundle" and CoreSimulator's installer then fails
      # with "Missing bundle ID" on `simctl install`, despite a perfectly
      # valid Info.plist. Pointing the folder reference at the GameData
      # subdirectory keeps the on-disk App/Resources/GameData/ layout
      # (Task 6/7) but lands the wads at the bundle root as GameData/*.
      - path: Resources/GameData
        type: folder
        buildPhase: resources
      # License texts surfaced by AboutView (GPL compliance). Same
      # folder-reference pattern as GameData (must NOT be named
      # "Resources"); lands in the bundle as Licenses/*.
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      # woof.pk3 must land at the bundle root (sibling of the executable,
      # NOT under GameData/): Woof! finds it via SDL_GetBasePath(), which
      # resolves to the app bundle root on iOS, and there's no argv flag
      # to redirect that search (see Scripts/build-engine.sh and
      # EngineSession.swift). A loose file reference here, rather than a
      # folder reference, copies just the file to the bundle root.
      - path: Resources/woof.pk3
        type: file
        buildPhase: resources
      # Privacy manifest (App Store requirement). App-scoped settings only
      # — scheme/tuning/debug toggles via UserDefaults (reason CA92.1); no
      # tracking, no data collection, no network. A loose file reference
      # lands it at the bundle root, where App Store Connect expects it.
      - path: PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      - framework: ../Vendor/out/WoofEngine.xcframework
        embed: false
      - package: ZIPFoundation
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: GameController.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreBluetooth.framework
      - sdk: OpenGLES.framework
  WaddleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        # xcodegen's bundle.ui-testing template doesn't imply this; without
        # it, CodeSign fails with "target does not have an Info.plist file".
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Waddle
  WaddleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Waddle
schemes:
  Waddle:
    build:
      targets:
        Waddle: all
    test:
      targets:
        - WaddleTests
        - WaddleUITests
