test:
    metadata:
        name: menu-input-telemetry
        platform: ios
        tags:
            - engine
            - input
            - diagnostic
    build:
        name: development
    blocks:
        - type: instructions
          step_description: Open Settings from the gear button on the shelf, turn on the 'Show Debug Info' toggle, and go back to the shelf.
        - type: instructions
          step_description: Start Freedoom Phase 2 from the shelf and wait for the engine's title screen to render. A thin line of small monospaced text (the debug strip) sits at the very top of the screen while the game runs.
        - type: extraction
          step_description: Read the debug strip at the top of the screen (small monospaced text, two or more lines) and extract, verbatim, the line that starts with 'pad=' (it contains pad=, pads=, btn= and menu= fields).
          variable_name: strip_on_title
        - type: instructions
          step_description: Tap the round menu button in the top-right corner of the touch overlay (three horizontal lines) once, so the Doom main menu opens. Tap nothing else.
        - type: extraction
          step_description: Read the debug strip again and extract, verbatim, the line that starts with 'pad='.
          variable_name: strip_menu_open
        - type: validation
          step_description: The Doom main menu is open with the skull cursor on New Game, and the debug strip ends with 'menu=0'. If it still says 'menu=off', the START press never reached the engine's menu.
        - type: instructions
          step_description: Press the round USE button at the bottom right of the touch overlay exactly once, with a normal quick tap. Do not tap anything else.
        - type: extraction
          step_description: Read the debug strip again and extract, verbatim, the line that starts with 'pad='.
          variable_name: strip_after_use
        - type: validation
          step_description: Compared with {{strip_menu_open}}, the btn= number in {{strip_after_use}} has grown by at least 2, and the screen has left the main menu for the skill (difficulty) selection screen. If btn= did not grow, the USE tap never reached the engine; if it grew but the menu did not change, the engine ignored the press.
        - type: instructions
          step_description: 'Get the Doom main menu back on screen with New Game highlighted: tapping the round menu button (top right) closes whatever menu is open, and tapping it once more opens the main menu again. Then, with the main menu showing, press and HOLD one finger in the empty lower-left quarter of the screen, drag it downward about a quarter of the screen height, keep holding there for two full seconds, and only then release. This is the virtual movement stick; a quick flick is not enough.'
        - type: extraction
          step_description: Read the debug strip again and extract, verbatim, the line that starts with 'pad='.
          variable_name: strip_after_stick
        - type: validation
          step_description: Compared with {{strip_menu_open}}, the mv= number in {{strip_after_stick}} has grown, meaning the stick drag produced menu moves (the skull cursor may have wrapped round to New Game again; that is fine). If mv= did not grow while pad= says foreign, another controller owns the stick axes; if pad= says virtual and lypk= is 0, the drag never registered as stick input; if lypk= is large but mv= did not grow, the engine saw the axis and the menu ignored it.
