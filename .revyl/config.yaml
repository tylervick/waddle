project:
    id: 636d33df-2697-4f07-8f60-a0b5a8657019
session:
    idle_timeout_seconds: 1800
build:
    framework: ios
    profiles:
        development:
            ios:
                # Required before a remote build is submitted: it binds this
                # recipe to the Revyl app that receives the artifact.
                # project.id above identifies the PROJECT, not the app, and a
                # remote build with no app_id is rejected before the runner
                # ever executes build_commands. A local build may omit it.
                app_id: "8d5b0635-f1df-4a9f-8978-366771843c12"
                # Matches XCODE_VERSION in ci.yml, cold-build.yml and
                # testflight.yml, so the runner compiles with the same Xcode
                # the project is already built and shipped with. Revyl's
                # default image is ios-macos-26-xcode-26.5; pinning keeps the
                # two in step, and a bump belongs here and in those workflows
                # together.
                image: ios-macos-26-xcode-26.2
                # build-deps.sh clones and compiles SDL3, OpenAL Soft,
                # sonivox, ogg, vorbis, sndfile, FLAC and opus from source for
                # BOTH iphoneos and iphonesimulator, then build-engine.sh
                # builds Woof! twice more and assembles the xcframework.
                # Vendor/ is gitignored, so none of it arrives with the
                # worktree and a cold runner pays the whole cost every time.
                # 7200 is an estimate -- this recipe has not been run
                # end-to-end on a Revyl runner.
                timeout_seconds: 7200
                build_commands:
                    # mise pins cmake/ninja/xcodegen (mise.toml) and owns the
                    # bootstrap task graph. Not assumed present on the image.
                    - curl -fsSL https://mise.run | sh
                    # A no-op under mise's normal mode, where `mise install`
                    # and `mise run` auto-trust their active config. Kept for
                    # paranoid mode, which requires explicit content-bound
                    # trust and cannot prompt on an unattended runner.
                    - ~/.local/bin/mise trust --yes
                    - ~/.local/bin/mise install
                    # bootstrap, not `mise run generate`: GameData/ and
                    # woof.pk3 are gitignored build outputs, and XcodeGen
                    # validates its source list before writing anything, so
                    # generate alone fails spec validation on a fresh
                    # checkout. See
                    # docs/learnings/xcodegen-needs-bootstrapped-resources.md.
                    # bootstrap = build-engine (which depends on build-deps)
                    # + fetch-freedoom + generate.
                    - ~/.local/bin/mise run bootstrap
                    # ENABLE_DEBUG_DYLIB=NO drops Waddle.debug.dylib and
                    # __preview.dylib, so the artifact is standalone rather
                    # than the Xcode debug-dylib layout.
                    #
                    # CODE_SIGNING_ALLOWED=NO because Debug uses Automatic
                    # signing, which needs a signed-in Xcode account the
                    # runner does not have. Simulator builds do not need a
                    # signature to install.
                    #
                    # Debug, not Release, on purpose: Release is Manual
                    # signing pinned to "Apple Distribution" and the
                    # "WADdle App Store CI" provisioning profile, neither of
                    # which exists on a build runner.
                    #
                    # ARCHS=arm64 is load-bearing, not tidiness. A generic
                    # iOS Simulator destination builds every simulator
                    # architecture, and WoofEngine.xcframework carries only an
                    # arm64 simulator slice -- so the x86_64 pass skips every
                    # object in libWoofEngine.a ("found architecture 'arm64',
                    # required architecture 'x86_64'") and the link fails with
                    # exit 65. The warnings name the architecture but nothing
                    # names the destination that asked for it.
                    - xcodebuild -project App/Waddle.xcodeproj -scheme Waddle -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64
                output_path: build/Build/Products/Debug-iphonesimulator/Waddle.app
# Pull-request automation. Written by hand rather than by `revyl github
# setup`, which requires an interactive terminal and refuses to run
# unattended; its own error names this path ("edit the project config
# directly, run revyl config validate, then ... commit the designated file
# when Git-managed").
pr_review:
    enabled: true
    review_triggers:
        # Repository-root-relative, matched against the paths GitHub reports.
        # Scoped to what can change the binary, so a docs-only or
        # learnings-only pull request does not queue a build. Engine/ and
        # Scripts/ are in the list because the engine is compiled from vendored
        # source by those scripts, not consumed as a released dependency.
        paths:
            - "App/**"
            - "Engine/**"
            - "Scripts/**"
            - "mise.toml"
        labels: []
        drafts: false
    build:
        # ci_upload_to_revyl, not revyl: ci.yml already builds this app behind
        # two content-keyed caches (measured 8m37s cold, 4m14s warm), so a
        # Revyl cloud build would recompile SDL3, OpenAL Soft, sonivox, ogg,
        # vorbis, sndfile, FLAC, opus and Woof from source a second time, per
        # pull request, having already paid for them here. Revyl matches the
        # uploaded artifact to the review by repository and head SHA.
        kind: ci_upload_to_revyl
        app_ids:
            ios: "8d5b0635-f1df-4a9f-8978-366771843c12"
    proof_of_changes:
        # Depends on the artifact from the CI upload step arriving first; proof
        # has nothing to install without it. Gated by review_triggers above, so
        # it runs on pull requests that can change the binary and not on
        # docs-only ones.
        enabled: true
        harness:
            kind: revyl
        # Invariants checked on every run in addition to the diff. These are
        # the parity behaviours README.md calls the baseline this app answers
        # to, not a restatement of whatever the pull request touched.
        always_verify:
            # Zero-setup launch is a parity requirement, not a nicety: Freedoom
            # is bundled, so a fresh install must be playable with no import
            # step. An empty shelf means the GameData/ folder reference did not
            # make it into the bundle -- a packaging failure the unit suite
            # cannot see.
            - "From a fresh install the shelf lists the bundled Freedoom games without any import step, and no error alert is shown on launch."
            # The engine is the point of the app, and it is the part unit tests
            # do not reach. Starting play is what proves the engine linked,
            # found woof.pk3 and its WADs, and rendered.
            - "Starting a game from the shelf reaches rendered gameplay rather than a stuck loading state or an engine error alert."
            # A game that renders but cannot be played is still broken, and the
            # overlay is drawn by the app rather than the engine.
            - "Once in a game, the touch control overlay is visible over the rendered view."
        system_prompt: |
            Waddle is an iOS port of the Woof! Doom engine. The SwiftUI shell is
            a WAD library: a shelf of playable games and presets, plus Manage,
            Settings, Control Feel and About screens. Freedoom Phase 1 and
            Phase 2 ship inside the app, so there is always something playable
            on a fresh install and no import is required. Do not try to import
            a WAD -- a test device has no files to import, and failing to find
            one is not a defect.

            On a fresh install there are no saved games, so the shelf's primary
            action is New Game or Play rather than Continue. "No saves yet" is
            correct on a first run, not a bug.

            Once a game starts, the screen belongs to the engine: it is an
            SDL/Metal surface with no accessibility tree, so element queries
            will find nothing there and that is expected rather than a failure
            to load. Judge gameplay from the screenshots. The touch control
            overlay drawn on top of it IS ordinary UIKit and can be addressed
            normally.

            Getting into a game and seeing it render is worth more than
            breadth across the settings screens.
    workflow_ids: []
    strict_ci_check:
        # false until the upload step has proven itself on a real pull
        # request. true makes a missing or failed upload block the merge, and
        # that is not a promise to make on a path that has never run.
        build: false
